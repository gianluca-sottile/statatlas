/* StatAtlas · Lab 06 — Media, mediana e massima verosimiglianza
 * Idea ispirata a Simul2000 (M. Chiodi): confronto di stimatori sugli stessi campioni.
 * Implementazione e testi originali. */
(function () {
  var THETA = 0, BINS = 48, SQ2PI = Math.sqrt(2 * Math.PI);
  var N_VALUES = [5, 10, 15, 20, 30, 50, 100, 200];
  var SPEEDS = [ // [repliche per passo, frame tra passi]
    { label: 'Lenta', per: 1, every: 20 }, { label: 'Media', per: 1, every: 4 },
    { label: 'Veloce', per: 3, every: 1 }, { label: 'Turbo', per: 25, every: 1 }];

  var EST = {
    mean:   { r: 'media',   label: 'Media',   long: 'Media campionaria',   col: 'c1', dash: null,    shape: 'tri' },
    median: { r: 'mediana', label: 'Mediana', long: 'Mediana campionaria', col: 'c2', dash: '7 4',   shape: 'diamond' },
    mle:    { r: 'mle',     label: 'MLE',     long: 'Massima verosimiglianza (numerica)', col: 'c3', dash: '2 3', shape: 'circle' }
  };

  /* Ogni modello: generatore identico a R, densità, stimatori e leggi teoriche */
  var MODELS = {
    normal: {
      label: 'Normale', law: 'N(θ, 1)', est: ['mean', 'median'], mleIs: 'mean',
      gen: function (g, n) { return g.rnorm(n, THETA, 1); },
      dens: function (x) { return SA.dens.norm(x, THETA, 1); },
      rGen: 'genera <- function(n) rnorm(n, mean = theta, sd = 1)',
      theory: function (n) { return {
        mean:   { sd: Math.sqrt(1 / n), st: 'exact', r: 'dnorm(x, theta, sqrt(1 / n))', txt: '1/√n' },
        median: { sd: Math.sqrt(Math.PI / (2 * n)), st: 'asym', r: 'dnorm(x, theta, sqrt(pi / (2 * n)))', txt: '√(π/(2n))' } }; },
      are: { a: 'median', b: 'mean', val: 2 / Math.PI, txt: '2/π' }
    },
    laplace: {
      label: 'Laplace', law: 'Laplace(θ, 1)', est: ['mean', 'median'], mleIs: 'median',
      gen: function (g, n) { return g.rlaplace(n, THETA, 1); },
      dens: function (x) { return SA.dens.laplace(x, THETA, 1); },
      rGen: '# Laplace(θ, b) per inversione: la stessa formula usata nel browser\n' +
        'rlaplace <- function(n, theta = 0, b = 1) {\n  u <- runif(n) - 0.5\n  theta - b * sign(u) * log(1 - 2 * abs(u))\n}\n' +
        'genera <- function(n) rlaplace(n, theta = theta, b = 1)',
      theory: function (n) { return {
        mean:   { sd: Math.sqrt(2 / n), st: 'asym', r: 'dnorm(x, theta, sqrt(2 / n))', txt: '√(2/n)' },
        median: { sd: Math.sqrt(1 / n), st: 'asym', r: 'dnorm(x, theta, sqrt(1 / n))', txt: '1/√n' } }; },
      are: { a: 'median', b: 'mean', val: 2, txt: '2' }
    },
    cauchy: {
      label: 'Cauchy', law: 'Cauchy(θ, 1)', est: ['mean', 'median', 'mle'], mleIs: null,
      gen: function (g, n) { return g.rcauchy(n, THETA, 1); },
      dens: function (x) { return SA.dens.cauchy(x, THETA, 1); },
      rGen: 'genera <- function(n) rcauchy(n, location = theta, scale = 1)\n\n' +
        '# MLE della posizione (scala nota = 1): algoritmo MM/IRLS dalla mediana.\n' +
        '# Ogni passo aumenta la verosimiglianza; converge a un massimo locale.\n' +
        'mle_cauchy <- function(x, tol = 1e-10, maxit = 100) {\n  theta_k <- median(x)\n  for (i in seq_len(maxit)) {\n' +
        '    w <- 1 / (1 + (x - theta_k)^2)\n    theta_new <- sum(w * x) / sum(w)\n    if (abs(theta_new - theta_k) < tol) break\n' +
        '    theta_k <- theta_new\n  }\n  theta_new\n}',
      theory: function (n) { return {
        mean:   { sd: Infinity, cauchy: true, st: 'exact', r: 'dcauchy(x, theta, 1)', txt: 'non esiste' },
        median: { sd: Math.PI / (2 * Math.sqrt(n)), st: 'asym', r: 'dnorm(x, theta, pi / (2 * sqrt(n)))', txt: 'π/(2√n)' },
        mle:    { sd: Math.sqrt(2 / n), st: 'asym', r: 'dnorm(x, theta, sqrt(2 / n))', txt: '√(2/n)' } }; },
      are: { a: 'median', b: 'mle', val: 8 / (Math.PI * Math.PI), txt: '8/π²' }
    }
  };

  var el, S; // stato

  function newState(prev) {
    var s = { model: 'normal', nIdx: 3, M: 1000, seed: 2026, speed: 1, prediction: null };
    if (prev) ['model', 'nIdx', 'M', 'seed', 'speed', 'prediction'].forEach(function (k) { s[k] = prev[k]; });
    s.n = N_VALUES[s.nIdx];
    s.rng = new SA.RRNG(s.seed);
    s.k = 0; s.running = false; s.frame = 0; s.last = null;
    s.est = {}; s.bins = {}; s.out = {};
    var th = MODELS[s.model].theory(s.n), maxVar = 0;
    MODELS[s.model].est.forEach(function (e) {
      s.est[e] = new Float64Array(s.M); s.bins[e] = new Uint32Array(BINS); s.out[e] = 0;
      if (isFinite(th[e].sd)) maxVar = Math.max(maxVar, th[e].sd * th[e].sd);
    });
    s.lim = +(4.5 * Math.sqrt(maxVar)).toFixed(4);
    s.th = th;
    return s;
  }

  function replicate() {
    if (S.k >= S.M) return false;
    var x = MODELS[S.model].gen(S.rng, S.n), vals = {};
    vals.mean = SA.stat.mean(x); vals.median = SA.stat.median(x);
    if (S.est.mle) vals.mle = SA.stat.mleCauchy(x);
    var bw = 2 * S.lim / BINS;
    for (var e in S.est) {
      var v = vals[e]; S.est[e][S.k] = v;
      var b = Math.floor((v - (THETA - S.lim)) / bw);
      if (b >= 0 && b < BINS) S.bins[e][b]++; else S.out[e]++;
    }
    S.last = { x: x, vals: vals };
    S.k++;
    return true;
  }

  /* ---------- grafici ---------- */
  var figSample, figDist, legendBox;

  function drawSample() {
    var W = 720, H = 168, X0 = -6, X1 = 6;
    var f = SA.plot.frame(figSample, { W: W, H: H, x: [X0, X1], m: { t: 10, r: 18, b: 40, l: 18 }, xlabel: 'x', label: 'Campione corrente' });
    var P = SA.plot, t = f.t, g = f.g, bandTop = 14, bandBot = 92, estY = 112;
    // densità del modello come sagoma di fondo
    var pk = MODELS[S.model].dens(THETA), pts = [];
    for (var i = 0; i <= 200; i++) { var xx = X0 + (X1 - X0) * i / 200; pts.push([f.x(xx), bandBot - (bandBot - bandTop) * MODELS[S.model].dens(xx) / pk]); }
    P.svg('path', { d: P.path(pts) + 'L' + f.x(X1) + ',' + bandBot + 'L' + f.x(X0) + ',' + bandBot + 'Z', fill: t.paper_2, stroke: t.rule_2 }, g);
    P.svg('line', { x1: f.x(THETA), x2: f.x(THETA), y1: bandTop - 4, y2: estY + 10, stroke: t.ink, 'stroke-dasharray': '3 3' }, g);
    var lab = P.svg('text', { x: f.x(THETA) + 4, y: bandTop + 4, fill: t.ink_2, 'font-family': t.serif, 'font-style': 'italic', 'font-size': 13 }, g);
    lab.textContent = 'θ';
    if (!S.last) {
      var msg = P.svg('text', { x: W / 2, y: 60, 'text-anchor': 'middle', fill: t.ink_3, 'font-size': 13 }, g);
      msg.textContent = 'Premi ▶ o “passo” per estrarre il primo campione';
      return;
    }
    var x = S.last.x, left = 0, right = 0;
    for (var j = 0; j < x.length; j++) {
      if (x[j] < X0) { left++; continue; } if (x[j] > X1) { right++; continue; }
      var jit = ((j * 0.6180339887) % 1);
      P.svg('circle', { cx: f.x(x[j]), cy: bandTop + 18 + jit * (bandBot - bandTop - 26), r: 3.6, fill: t.ink, 'fill-opacity': 0.55, stroke: t.card, 'stroke-width': 0.8 }, g);
    }
    function edgeNote(cnt, side) {
      if (!cnt) return;
      var tx = P.svg('text', { x: side < 0 ? f.x(X0) : f.x(X1), y: bandTop + 6, 'text-anchor': side < 0 ? 'start' : 'end', fill: t.accent, 'font-size': 11, 'font-weight': 600 }, g);
      tx.textContent = side < 0 ? '◂ ' + cnt + ' fuori' : cnt + ' fuori ▸';
    }
    edgeNote(left, -1); edgeNote(right, 1);
    P.svg('line', { x1: f.x(X0), x2: f.x(X1), y1: estY, y2: estY, stroke: t.rule }, g);
    MODELS[S.model].est.forEach(function (e) {
      var v = S.last.vals[e], c = t[EST[e].col], cx = f.x(Math.max(X0, Math.min(X1, v)));
      P.svg('line', { x1: cx, x2: cx, y1: bandTop, y2: estY, stroke: c, 'stroke-width': 1.6, 'stroke-dasharray': EST[e].dash }, g);
      P.marker(g, EST[e].shape, cx, estY, 12, c, t.card);
    });
  }

  function drawDist() {
    var lim = S.lim, x0 = THETA - lim, x1 = THETA + lim, bw = 2 * lim / BINS, peak = 0;
    MODELS[S.model].est.forEach(function (e) {
      var th = S.th[e]; peak = Math.max(peak, th.cauchy ? 1 / Math.PI : 1 / (th.sd * SQ2PI));
    });
    var ymax = +(peak * 1.3).toPrecision(2);
    var f = SA.plot.frame(figDist, { W: 720, H: 300, x: [x0, x1], y: [0, ymax], xlabel: 'stima di θ', ylabel: 'densità', label: 'Distribuzioni campionarie degli stimatori' });
    var P = SA.plot, t = f.t, g = f.g, yb = f.y(0);
    P.svg('line', { x1: f.x(THETA), x2: f.x(THETA), y1: f.m.t, y2: yb, stroke: t.ink, 'stroke-dasharray': '3 3' }, g);
    var order = MODELS[S.model].est;
    // istogrammi (simulazione)
    if (S.k > 0) order.forEach(function (e) {
      var c = t[EST[e].col], d = 'M' + f.x(x0).toFixed(1) + ',' + yb.toFixed(1);
      for (var b = 0; b < BINS; b++) {
        var h = Math.max(f.m.t, f.y(S.bins[e][b] / (S.k * bw)));
        d += 'L' + f.x(x0 + b * bw).toFixed(1) + ',' + h.toFixed(1) + 'L' + f.x(x0 + (b + 1) * bw).toFixed(1) + ',' + h.toFixed(1);
      }
      d += 'L' + f.x(x1).toFixed(1) + ',' + yb.toFixed(1) + 'Z';
      P.svg('path', { d: d, fill: c, 'fill-opacity': 0.12, stroke: c, 'stroke-opacity': 0.7, 'stroke-width': 1 }, g);
    });
    // curve teoriche
    order.forEach(function (e) {
      var th = S.th[e], pts = [];
      for (var i = 0; i <= 240; i++) {
        var xx = x0 + (x1 - x0) * i / 240;
        var dv = th.cauchy ? SA.dens.cauchy(xx, THETA, 1) : SA.dens.norm(xx, THETA, th.sd);
        pts.push([f.x(xx), Math.max(f.m.t, f.y(dv))]);
      }
      P.svg('path', { d: P.path(pts), fill: 'none', stroke: t[EST[e].col], 'stroke-width': 2.4, 'stroke-dasharray': EST[e].dash, 'stroke-linejoin': 'round' }, g);
    });
    // stime fuori scala
    var notes = order.filter(function (e) { return S.out[e] > 0; }).map(function (e) {
      return EST[e].label.toLowerCase() + ' ' + S.out[e] + ' (' + SA.fmt(100 * S.out[e] / S.k, 1) + '%)';
    });
    if (notes.length) {
      var tx = P.svg('text', { x: f.W - f.m.r, y: f.m.t + 12, 'text-anchor': 'end', fill: t.accent, 'font-size': 11.5, 'font-weight': 600 }, g);
      tx.textContent = 'Fuori scala: ' + notes.join(' · ');
    }
    var cnt = P.svg('text', { x: f.m.l + 8, y: f.m.t + 12, fill: t.ink_3, 'font-size': 11.5 }, g);
    cnt.textContent = S.k + ' campioni su ' + S.M;
  }

  function buildLegend() {
    var t = SA.theme();
    legendBox.innerHTML = '';
    MODELS[S.model].est.forEach(function (e) {
      legendBox.appendChild(el('span', SA.plot.legendSwatch(t[EST[e].col], EST[e].dash, EST[e].shape), EST[e].label));
    });
    legendBox.appendChild(el('span.muted', 'area: simulazione · curva: teoria'));
  }

  /* ---------- tabella teoria vs simulazione ---------- */
  var tblBody, kpiBox, fbBox, interpBox;
  function summary() {
    var out = {};
    MODELS[S.model].est.forEach(function (e) {
      var v = S.est[e].subarray(0, S.k), s = { k: S.k };
      if (S.k >= 2) {
        var srt = SA.stat.sorted(v), mse = 0;
        for (var i = 0; i < v.length; i++) mse += (v[i] - THETA) * (v[i] - THETA);
        s.center = SA.stat.quantile(srt, 0.5, true);
        s.iqr = SA.stat.quantile(srt, 0.75, true) - SA.stat.quantile(srt, 0.25, true);
        s.sd = SA.stat.sd(v); s.mse = mse / v.length;
      }
      out[e] = s;
    });
    return out;
  }
  function updateTable() {
    var sm = summary(), fmt = SA.fmt;
    tblBody.innerHTML = '';
    MODELS[S.model].est.forEach(function (e) {
      var th = S.th[e], s = sm[e], noVar = !isFinite(th.sd);
      var iqrT = th.cauchy ? 2 : 2 * 0.6744897502 * th.sd;
      var swatch = SA.plot.legendSwatch(SA.theme()[EST[e].col], EST[e].dash, EST[e].shape);
      var dag = noVar ? el('sup', { title: 'La varianza teorica non esiste: questo numero non converge al crescere delle repliche' }, '†') : null;
      tblBody.appendChild(el('tr',
        el('td', el('span.est', swatch, EST[e].label), MODELS[S.model].mleIs === e ? el('span.th', '= MLE in questo modello') : null),
        el('td', fmt(s.center), el('span.th', 'teoria ' + fmt(THETA))),
        el('td', fmt(s.sd), dag, el('span.th', 'teoria ' + (noVar ? 'non esiste' : fmt(th.sd) + ' = ' + th.txt))),
        el('td', fmt(s.iqr), el('span.th', 'teoria ' + fmt(iqrT))),
        el('td', fmt(s.mse), dag, el('span.th', noVar ? 'teoria: non esiste' : 'teoria ≈ ' + fmt(th.sd * th.sd))),
        el('td', SA.ui.badge(th.st))));
    });
    // efficienza relativa
    var are = MODELS[S.model].are, sa = sm[are.a], sb = sm[are.b];
    var effSim = sa && sb && sa.sd ? (sb.sd * sb.sd) / (sa.sd * sa.sd) : NaN;
    kpiBox.innerHTML = '';
    kpiBox.append(
      el('div.kpi', el('b', S.k + ' / ' + S.M), el('span', 'campioni generati')),
      el('div.kpi', el('b', fmt(are.val, 3)), el('span', 'efficienza asintotica ' + EST[are.a].label.toLowerCase() + ' vs ' + EST[are.b].label.toLowerCase() + ' = ' + are.txt + ' '), SA.ui.badge('asym')),
      el('div.kpi', el('b', fmt(effSim, 3)), el('span', 'stessa quantità stimata: Var(' + EST[are.b].label.toLowerCase() + ') / Var(' + EST[are.a].label.toLowerCase() + ') '), SA.ui.badge('mc')));
    updateFeedback(sm);
  }

  /* ---------- previsione ---------- */
  function predOptions() {
    var o = [['mean', 'La media'], ['median', 'La mediana']];
    if (S.model === 'cauchy') o.push(['mle', 'L’MLE numerico']);
    o.push(['tie', 'Sono praticamente equivalenti']);
    return o;
  }
  function updateFeedback(sm) {
    if (!S.prediction) { fbBox.hidden = true; return; }
    fbBox.hidden = false;
    if (S.k < 200) { fbBox.textContent = 'Previsione registrata. Il confronto compare dopo almeno 200 campioni (ora ' + S.k + ').'; return; }
    var ests = MODELS[S.model].est, best = ests[0];
    ests.forEach(function (e) { if (sm[e].iqr < sm[best].iqr) best = e; });
    var sortedIqr = ests.map(function (e) { return sm[e].iqr; }).sort(function (a, b) { return a - b; });
    var tie = sortedIqr[1] / sortedIqr[0] < 1.05;
    var right = (S.prediction === 'tie' && tie) || S.prediction === best;
    var msg = (right ? '✓ La simulazione conferma la tua previsione. ' : '✗ La simulazione dice altro. ') +
      'Lo stimatore più concentrato attorno a θ (scarto interquartile minore) è ' + EST[best].label.toLowerCase() + ': ' +
      ests.map(function (e) { return EST[e].label.toLowerCase() + ' ' + SA.fmt(sm[e].iqr); }).join(', ') + '.';
    fbBox.textContent = msg;
  }

  /* ---------- interpretazione ---------- */
  function interpretation() {
    var n = S.n, mc = ' Le quantità simulate sono stime Monte Carlo: con M = ' + S.M + ' repliche la deviazione standard simulata ha un errore relativo dell’ordine di 1/√(2M) ≈ ' + SA.fmt(100 / Math.sqrt(2 * S.M), 1) + '%.';
    var txt = {
      normal: '<p>Con dati normali la <strong>media</strong> è lo stimatore di massima verosimiglianza ed è esattamente N(θ, 1/n): raggiunge il limite di Cramér–Rao, e nessuno stimatore non distorto fa meglio. La <strong>mediana</strong> ha varianza asintotica π/(2n): per ottenere la stessa precisione servono circa π/2 ≈ 1,57 volte più osservazioni.</p><p><strong>Condizione:</strong> il vantaggio della media dipende dall’ipotesi di normalità. Basta una piccola quota di osservazioni da code pesanti per ribaltare il confronto: prova il modello Laplace o Cauchy.</p>',
      laplace: '<p>Con code esponenziali il confronto si ribalta. La <strong>mediana</strong> è lo stimatore di massima verosimiglianza (minimizza Σ|xᵢ − θ|) e ha varianza asintotica 1/n, la metà di quella della <strong>media</strong> (2/n). La media resta non distorta e asintoticamente normale per il teorema del limite centrale, ma spreca informazione.</p><p><strong>Attenzione:</strong> per n = ' + n + ' le curve teoriche sono approssimazioni asintotiche; con n piccolo la distribuzione della mediana non è ancora normale.</p>',
      cauchy: '<p>La media di n osservazioni Cauchy ha <em>ancora</em> legge Cauchy(θ, 1): non si concentra al crescere di n, perché E|X| = ∞ e la legge dei grandi numeri non si applica. Per questo la sua deviazione standard simulata (†) non converge: ogni tanto un valore enorme la fa saltare.</p><p>La <strong>mediana</strong> è consistente, con varianza asintotica π²/(4n). L’<strong>MLE</strong>, calcolato numericamente, fa meglio ancora (2/n, il limite di Cramér–Rao). La mediana <em>non</em> è l’MLE della Cauchy: qui è solo il punto di partenza dell’algoritmo, e l’equazione di verosimiglianza può avere più radici.</p>'
    };
    interpBox.innerHTML = txt[S.model] + '<p class="muted">' + mc + '</p>';
  }

  /* ---------- codice R ---------- */
  function codeR() {
    var m = MODELS[S.model], ests = m.est, th = S.th, f4 = function (v) { return (+v.toFixed(4)).toString(); };
    var est = ests.map(function (e) {
      var fn = e === 'mean' ? 'mean' : e === 'median' ? 'median' : 'mle_cauchy';
      return '    ' + EST[e].r + ' '.repeat(8 - EST[e].r.length) + '= map_dbl(campione, ' + fn + ')';
    }).join(',\n');
    var teo = ests.map(function (e) { return '    ' + EST[e].r + ' '.repeat(8 - EST[e].r.length) + '= ' + th[e].r; }).join(',\n');
    var teoSd = ests.map(function (e) { return EST[e].r + ' ' + (isFinite(th[e].sd) ? f4(th[e].sd) : 'non esiste (media ~ Cauchy(θ, 1))'); }).join(', ');
    var cols = ests.map(function (e) { return EST[e].r + ' = "' + { c1: '#0072B2', c2: '#D55E00', c3: '#009E73' }[EST[e].col] + '"'; }).join(', ');
    var mleNote = m.mleIs ? '\n# Nel modello ' + m.label + ' lo stimatore di massima verosimiglianza coincide con la ' + EST[m.mleIs].r + '.' : '';
    return [
      '# ───────────────────────────────────────────────────────────────',
      '# StatAtlas · Lab 06 — Media, mediana e massima verosimiglianza',
      '# Modello: ' + m.law.replace('θ', 'θ = ' + THETA) + ' · n = ' + S.n + ' · M = ' + S.M + ' · seed = ' + S.seed,
      '# Con R ≥ 4.1 e il generatore predefinito (Mersenne-Twister,',
      '# normal.kind = "Inversion") i campioni coincidono con quelli di StatAtlas.',
      '# ───────────────────────────────────────────────────────────────',
      'library(tidyverse)',
      '',
      '# Parametri -------------------------------------------------------',
      'theta <- ' + THETA + '        # vero parametro di posizione',
      'n     <- ' + S.n + ' '.repeat(Math.max(1, 9 - String(S.n).length)) + '# numerosità di ogni campione',
      'M     <- ' + S.M + ' '.repeat(Math.max(1, 9 - String(S.M).length)) + '# numero di campioni (repliche)',
      'set.seed(' + S.seed + ')',
      '',
      '# Modello generatore ----------------------------------------------',
      m.rGen + mleNote,
      '',
      '# 1. Simulazione: M campioni generati uno dopo l’altro ------------',
      'sim <- tibble(replica = seq_len(M)) |>',
      '  mutate(campione = map(replica, \\(r) genera(n)))',
      '',
      'stime <- sim |>',
      '  transmute(',
      '    replica,',
      est,
      '  )',
      '',
      '# 2. Teoria vs simulazione ----------------------------------------',
      'stime_lunghe <- stime |>',
      '  pivot_longer(-replica, names_to = "stimatore", values_to = "stima")',
      '',
      'stime_lunghe |>',
      '  group_by(stimatore) |>',
      '  summarise(',
      '    centro  = median(stima),          # teoria: θ (per simmetria)',
      '    dev_std = sd(stima),',
      '    iqr     = IQR(stima),',
      '    mse     = mean((stima - theta)^2)',
      '  )',
      '# Dev. std teoriche: ' + teoSd,
      '',
      '# 3. Grafico: distribuzioni campionarie ---------------------------',
      'lim <- ' + f4(S.lim) + '   # finestra [θ − lim, θ + lim]',
      'bw  <- 2 * lim / ' + BINS,
      'colori <- c(' + cols + ')',
      '',
      'teoria <- tibble(x = seq(theta - lim, theta + lim, length.out = 400)) |>',
      '  mutate(',
      teo,
      '  ) |>',
      '  pivot_longer(-x, names_to = "stimatore", values_to = "densita")',
      '',
      'theme_statatlas <- function(base_size = 12) {',

  /* ---------- approfondimenti ---------- */
  var THEORY = {

        '<p>Uno <strong>stimatore</strong> è una regola che trasforma il campione in un numero. Poiché il campione è casuale, anche la stima lo è: la sua legge si chiama <strong>distribuzione campionaria</strong>. Il laboratorio la costruisce ripetendo lo stesso esperimento M volte.</p>' +

        '<p>La media usa il <em>valore</em> di ogni osservazione: una sola osservazione molto grande la sposta quanto vuole. La mediana usa solo l’<em>ordine</em>: resta stabile finché meno di metà dei dati è anomala. Si dice che la media ha punto di rottura 0 e la mediana 50%.</p>' +

        '<p>Idea della dimostrazione: M<sub>n</sub> ≤ θ + t/√n se e solo se almeno metà delle osservazioni cade sotto θ + t/√n. Il numero di tali osservazioni è binomiale con probabilità F(θ + t/√n) ≈ ½ + f(θ) t/√n; il teorema del limite centrale per la binomiale conclude.</p>' +
        '<p>Con f(θ) = 1/√(2π) (Normale) si ottiene π/(2n); con f(θ) = 1/2 (Laplace, b = 1) si ottiene 1/n; con f(θ) = 1/π (Cauchy) si ottiene π²/(4n).</p>' +

  var THEORY = {

/* StatAtlas · Lab 08 — Intervalli di confidenza: copertura nominale, esatta e osservata */
(function () {
  var el, S, LAWS = SA.laws, SHOW = 40;
  var tq = function (p, df) { return LAWS.get('t').q(p, { df: df }); };
  var cq = function (p, df) { return LAWS.get('chisq').q(p, { df: df }); };
  var lchoose = SA.sf.lchoose;

  var METHODS = {
    z: { label: 'Media normale, σ nota (Z)', par: 'μ', model: 'norm', st: 'exact',
      ci: function (x, a) { var m = SA.stat.mean(x), h = SA.qnorm(1 - a / 2) * S.sigma / Math.sqrt(x.length); return [m - h, m + h]; },
      formula: 'x̄ ± z<sub>1−α/2</sub> σ/√n', r: 'z <- qnorm(1 - a / 2)\n  mean(x) + c(-1, 1) * z * sigma / sqrt(n)' },
    t: { label: 'Media normale, σ ignota (t)', par: 'μ', model: 'norm', st: 'exact',
      ci: function (x, a) { var n = x.length, m = SA.stat.mean(x), h = tq(1 - a / 2, n - 1) * SA.stat.sd(x) / Math.sqrt(n); return [m - h, m + h]; },
      formula: 'x̄ ± t<sub>n−1, 1−α/2</sub> s/√n', r: 'mean(x) + c(-1, 1) * qt(1 - a / 2, n - 1) * sd(x) / sqrt(n)' },
    wald: { label: 'Proporzione: Wald', par: 'p', model: 'bern', st: 'asym',
      ci: function (x, a) { var n = x.length, p = SA.stat.mean(x), h = SA.qnorm(1 - a / 2) * Math.sqrt(p * (1 - p) / n); return [p - h, p + h]; },
      ciS: function (s, n, a) { var p = s / n, h = SA.qnorm(1 - a / 2) * Math.sqrt(p * (1 - p) / n); return [p - h, p + h]; },
      formula: 'p̂ ± z<sub>1−α/2</sub> √(p̂(1 − p̂)/n)', r: 'p <- mean(x); z <- qnorm(1 - a / 2)\n  p + c(-1, 1) * z * sqrt(p * (1 - p) / n)' },
    wilson: { label: 'Proporzione: Wilson', par: 'p', model: 'bern', st: 'asym',
      ci: function (x, a) { return METHODS.wilson.ciS(x.reduce(function (s, v) { return s + v; }, 0), x.length, a); },
      ciS: function (s, n, a) {
        var p = s / n, z = SA.qnorm(1 - a / 2), den = 1 + z * z / n, c = (p + z * z / (2 * n)) / den, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / den;
        return [Math.max(0, c - h), Math.min(1, c + h)];
      },
      formula: '[p̂ + z²/(2n) ± z √(p̂(1 − p̂)/n + z²/(4n²))] / (1 + z²/n)',
      r: 'p <- mean(x); z <- qnorm(1 - a / 2); den <- 1 + z^2 / n\n  ctr <- (p + z^2 / (2 * n)) / den\n  h <- z * sqrt(p * (1 - p) / n + z^2 / (4 * n^2)) / den\n  c(max(0, ctr - h), min(1, ctr + h))' },
    garwood: { label: 'Media Poisson: Garwood (esatto)', par: 'λ', model: 'pois', st: 'exact',
      ci: function (x, a) { return METHODS.garwood.ciS(x.reduce(function (s, v) { return s + v; }, 0), x.length, a); },
      ciS: function (s, n, a) { return [s === 0 ? 0 : cq(a / 2, 2 * s) / (2 * n), cq(1 - a / 2, 2 * s + 2) / (2 * n)]; },
      formula: '[χ²<sub>2S, α/2</sub> / (2n), χ²<sub>2S+2, 1−α/2</sub> / (2n)], &nbsp;S = Σxᵢ',
      r: 's <- sum(x)\n  c(if (s == 0) 0 else qchisq(a / 2, 2 * s) / (2 * n), qchisq(1 - a / 2, 2 * s + 2) / (2 * n))' },
    exp: { label: 'Tasso esponenziale: pivot χ²', par: 'λ', model: 'exp', st: 'exact',
      ci: function (x, a) { var n = x.length, s = x.reduce(function (t, v) { return t + v; }, 0); return [cq(a / 2, 2 * n) / (2 * s), cq(1 - a / 2, 2 * n) / (2 * s)]; },
      formula: '[χ²<sub>2n, α/2</sub>, χ²<sub>2n, 1−α/2</sub>] / (2 Σxᵢ)', r: 's <- sum(x)\n  c(qchisq(a / 2, 2 * n), qchisq(1 - a / 2, 2 * n)) / (2 * s)' }
  };
  var MODELS = {
    norm: { gen: function (g, n) { return g.rnorm(n, S.mu, S.sigma); }, truth: function () { return S.mu; }, se: function (n) { return S.sigma / Math.sqrt(n); }, r: function () { return 'rnorm(n, mean = ' + S.mu + ', sd = ' + S.sigma + ')'; } },
    bern: { gen: function (g, n) { var o = new Float64Array(n); for (var i = 0; i < n; i++) o[i] = LAWS.get('bern').q(g.unif(), { prob: S.p }); return o; }, truth: function () { return S.p; }, se: function (n) { return Math.sqrt(S.p * (1 - S.p) / n); }, r: function () { return 'qbinom(runif(n), size = 1, prob = ' + S.p + ')'; } },
    pois: { gen: function (g, n) { var o = new Float64Array(n); for (var i = 0; i < n; i++) o[i] = LAWS.get('pois').q(g.unif(), { lambda: S.lambda }); return o; }, truth: function () { return S.lambda; }, se: function (n) { return Math.sqrt(S.lambda / n); }, r: function () { return 'qpois(runif(n), lambda = ' + S.lambda + ')'; } },
    exp: { gen: function (g, n) { var o = new Float64Array(n); for (var i = 0; i < n; i++) o[i] = -Math.log1p(-g.unif()) / S.rate; return o; }, truth: function () { return S.rate; }, se: function (n) { return S.rate / Math.sqrt(n); }, r: function () { return 'qexp(runif(n), rate = ' + S.rate + ')'; } }
  };

  function newState(prev) {
    var s = { method: 'z', n: 20, level: 0.95, B: 1000, seed: 2026, mu: 10, sigma: 2, p: 0.1, lambda: 2, rate: 1, pred: null };
    if (prev) for (var k in s) if (prev[k] !== undefined) s[k] = prev[k];

  var exactCache = {};
  function exactCoverage() {
    var m = M(), key = [S.method, S.n, S.level, S.p, S.lambda].join('|');
    if (exactCache[key] != null) return exactCache[key];
    var a = 1 - S.level, n = S.n, c = 0, s, pr;
    if (m.model === 'bern') {

    } else c = S.level;
    return (exactCache[key] = c);
  }
  function theoWidth() {
    var a = 1 - S.level, n = S.n;
    if (S.method === 'z') return 2 * SA.qnorm(1 - a / 2) * S.sigma / Math.sqrt(n);
    if (S.method === 't') { var c4 = Math.sqrt(2 / (n - 1)) * Math.exp(SA.sf.lgamma(n / 2) - SA.sf.lgamma((n - 1) / 2)); return 2 * tq(1 - a / 2, n - 1) * c4 * S.sigma / Math.sqrt(n); }
    return NaN;
  }

  function step() {
    if (S.k >= S.B) return false;

/* StatAtlas · Lab 09 — Test Z, errore di primo tipo e potenza */
(function () {
  var el, S, BINS = 48, Phi = SA.sf.pnorm, q = SA.qnorm;

  function newState(prev) {

  }
  function nc(s) { s = s || S; return s.delta * Math.sqrt(s.n); }
  function range(s) { var m = nc(s); return [Math.min(-4, m - 4), Math.max(4, m + 4)]; }
  function crit(s) { s = s || S; return s.alt === 'two' ? q(1 - s.alpha / 2) : q(1 - s.alpha); }
  function reject(z) { return S.alt === 'two' ? Math.abs(z) > crit() : z > crit(); }
  function power(delta, n) {

  }

  function step() {

  }

  var figA, figB, legA, legB;

      var pts = [[f.x(a), yb]];
      for (var i = 0; i <= 80; i++) { var x = a + (b - a) * i / 80; pts.push([f.x(x), f.y(SA.dens.norm(x, mu, 1))]); }
      pts.push([f.x(b), yb]);

    regs.forEach(function (r) { area(m, r[0], r[1], t.c1); area(0, r[0], r[1], t.c2); });
    P.hist(f, S.c0, S.lo, S.hi, S.k, t.c2, { opacity: 0.08, dash: '3 2' });
    P.hist(f, S.c1, S.lo, S.hi, S.k, t.c1, { opacity: 0.08 });
    P.curve(f, function (x) { return SA.dens.norm(x, 0, 1); }, S.lo, S.hi, { stroke: t.c2, 'stroke-dasharray': '7 4' });
    P.curve(f, function (x) { return SA.dens.norm(x, m, 1); }, S.lo, S.hi, { stroke: t.c1 });
    (S.alt === 'two' ? [-c, c] : [c]).forEach(function (v) {
      P.svg('line', { x1: f.x(v), x2: f.x(v), y1: f.m.t, y2: yb, stroke: t.ink, 'stroke-width': 1.2 }, g);
      P.text(g, f.x(v) + 4, f.m.t + 10, (v < 0 ? '−' : '') + 'z* = ' + SA.fmt(Math.abs(v), 3), { fill: t.ink_2, 'font-size': 11.5 });
    });
    P.text(g, f.x(0), f.y(0.41), 'H₀: μ = μ₀', { 'text-anchor': 'middle', fill: t.c2, 'font-size': 12, 'font-weight': 600 });
    P.text(g, f.x(m), f.y(0.41) - (Math.abs(m) < 1.2 ? 16 : 0), 'H₁: μ = μ₀ + ' + SA.fmt(S.delta, 2) + 'σ', { 'text-anchor': 'middle', fill: t.c1, 'font-size': 12, 'font-weight': 600 });
  }
  function drawPower() {
    var P = SA.plot, f = P.frame(figB, { W: 720, H: 250, x: [0, 1.5], y: [0, 1], xlabel: 'effetto δ = (μ − μ₀)/σ', ylabel: 'potenza', label: 'Curva di potenza' });
    var t = f.t, g = f.g;
    P.svg('line', { x1: f.x(0), x2: f.x(1.5), y1: f.y(S.alpha), y2: f.y(S.alpha), stroke: t.c2, 'stroke-dasharray': '3 3' }, g);
    P.svg('line', { x1: f.x(0), x2: f.x(1.5), y1: f.y(0.8), y2: f.y(0.8), stroke: t.rule_2, 'stroke-dasharray': '2 4' }, g);
    P.text(g, f.x(1.5) - 4, f.y(0.8) - 5, '80%', { 'text-anchor': 'end', fill: t.ink_3, 'font-size': 11 });
    P.curve(f, function (d) { return power(d, Math.max(2, Math.round(S.n / 2))); }, 0, 1.5, { stroke: t.ink_3, 'stroke-width': 1.4, 'stroke-dasharray': '2 3' });
    P.curve(f, function (d) { return power(d, S.n * 2); }, 0, 1.5, { stroke: t.c3, 'stroke-width': 1.6, 'stroke-dasharray': '7 4' });
    P.curve(f, function (d) { return power(d, S.n); }, 0, 1.5, { stroke: t.c1 });
    var pw = power(S.delta, S.n);
    P.marker(g, 'circle', f.x(S.delta), f.y(pw), 11, t.card, t.c1);
    if (S.k) {

  function buildPrediction() {

  }

  function interpretation() {
    interpBox.innerHTML = '<p>Il test rifiuta H₀ quando la statistica cade nella regione critica. Sotto H₀ questo accade con probabilità α, <strong>esattamente</strong> (dati normali, σ nota): è un rischio scelto prima di vedere i dati. Sotto H₁ la statistica è spostata di δ√n = ' + SA.fmt(nc(), 2) + ' e la probabilità di rifiuto è la <strong>potenza</strong>.</p>' +
      '<p>La potenza dipende da tre leve: l’effetto δ, la numerosità n e il livello α. Raddoppiare n moltiplica lo spostamento per √2, non per 2. ' + (S.alt === 'two' ? 'Il test bilaterale divide α tra le due code: a parità di α, contro un’alternativa unilaterale è meno potente del test unilaterale.' : 'Il test unilaterale concentra α in una sola coda: è più potente se l’effetto va nella direzione attesa, ma cieco all’altra.') + '</p>' +
      '<p class="muted">Il p-value è P(statistica almeno così estrema | H₀). Non è la probabilità che H₀ sia vera, e un p-value grande non prova l’assenza di effetto: guarda la potenza.</p>';
  }

  function codeR() {
    var two = S.alt === 'two';
    return ['# ───────────────────────────────────────────────────────────────', '# StatAtlas · Lab 09 — Test Z ' + (two ? 'bilaterale' : 'unilaterale destro') + ': livello e potenza',
      '# Con R ≥ 4.1 e lo stesso seed si ottengono le stesse statistiche di StatAtlas.', '# ───────────────────────────────────────────────────────────────',
      'library(tidyverse)', '', 'set.seed(' + S.seed + ')',
      'n <- ' + S.n + '; B <- ' + S.B + '; alpha <- ' + S.alpha + '; delta <- ' + S.delta + '   # effetto in unità di σ (σ = 1, μ₀ = 0)',
      'z_crit <- qnorm(1 - alpha' + (two ? ' / 2' : '') + ')',
      'rifiuta <- function(z) ' + (two ? 'abs(z) > z_crit' : 'z > z_crit'), '',
      '# Per ogni replica: un campione sotto H0, poi uno sotto H1 (stesso ordine di StatAtlas)',
      'sim <- tibble(replica = seq_len(B)) |>',
      '  mutate(z = map(replica, \\(r) c(z0 = sqrt(n) * mean(rnorm(n, 0, 1)),',
      '                                 z1 = sqrt(n) * mean(rnorm(n, delta, 1))))) |>',
      '  unnest_wider(z)', '',
      'potenza_teorica <- function(d, n) ' + (two ? 'pnorm(-z_crit + d * sqrt(n)) + pnorm(-z_crit - d * sqrt(n))' : 'pnorm(d * sqrt(n) - z_crit)'),
      'sim |> summarise(errore_I = mean(rifiuta(z0)), potenza = mean(rifiuta(z1))) |>',
      '  mutate(alpha = alpha, potenza_teorica = potenza_teorica(delta, n))', '',
      '# n per potenza 80%' + (two ? ' (approssimato: trascura la coda opposta)' : ' (esatto)'),
      'ceiling(((z_crit + qnorm(0.8)) / delta)^2)', '',
      'theme_statatlas <- function(base_size = 12) {', '  theme_minimal(base_size = base_size, base_family = "serif") +',
      '    theme(panel.grid.minor = element_blank(), legend.position = "top",', '          plot.background = element_rect(fill = "#FAF8F3", colour = NA))', '}', '',
      '# Curve di potenza per n/2, n, 2n',
      'expand_grid(d = seq(0, 1.5, by = 0.01), n_ = c(max(2, round(n / 2)), n, 2 * n)) |>',
      '  mutate(potenza = potenza_teorica(d, n_), n_ = factor(n_)) |>',
      '  ggplot(aes(d, potenza, colour = n_, linetype = n_)) +',
      '  geom_hline(yintercept = c(alpha, 0.8), linetype = "dotted", colour = "grey50") +',
      '  geom_line(linewidth = 0.9) +',
      '  annotate("point", x = delta, y = mean(rifiuta(sim$z1)), shape = 18, size = 4, colour = "#9A3412") +',
      '  scale_colour_manual(values = c("grey55", "#0072B2", "#009E73")) +',
      '  labs(title = "Curva di potenza del test Z", x = expression(delta == (mu - mu[0]) / sigma), y = "potenza", colour = "n", linetype = "n") +',
      '  theme_statatlas()', ''].join('\n');
  }

  var THEORY = {
    base: function () {
      return el('div.prose', { html: '<h3>Due ipotesi, due errori</h3><table class="tv"><thead><tr><th></th><th>Non rifiuto H₀</th><th>Rifiuto H₀</th></tr></thead><tbody>' +
        '<tr><td>H₀ vera</td><td>corretto</td><td>errore di I tipo (α)</td></tr><tr><td>H₁ vera</td><td>errore di II tipo (β)</td><td>corretto: potenza 1 − β</td></tr></tbody></table>' +
        '<h3>Il test Z</h3><p>Con dati N(μ, σ²) e σ nota, z = √n (x̄ − μ₀)/σ ha legge N(0, 1) se μ = μ₀ e N(δ√n, 1) se μ = μ₀ + δσ. Si rifiuta se |z| &gt; z<sub>1−α/2</sub> (bilaterale) o z &gt; z<sub>1−α</sub> (unilaterale).</p>' +
        '<div class="eq">potenza(δ) = Φ(δ√n − z<sub>1−α/2</sub>) + Φ(−δ√n − z<sub>1−α/2</sub>)</div>' +

  function drawInfluence() {

    });
    var st = stationary(S.p1, S.p2), inv = Math.abs(S.th) < 1;
    kpiBox.innerHTML = '';
    kpiBox.append(el('div.kpi', el('b', S.k + ' / ' + S.T), el('span', 'osservazioni (dopo ' + BURN + ' di riscaldamento)')),
      el('div.kpi', el('b', st ? 'stazionario' : 'non stazionario'), el('span', 'radici reciproche AR ' + (st ? 'dentro' : 'non tutte dentro') + ' il cerchio')),
      el('div.kpi', el('b', inv ? 'invertibile' : 'non invertibile'), el('span', '|θ₁| ' + (inv ? '<' : '≥') + ' 1')));
    updateFeedback();
  }
  function buildPrediction() {
    predBox.innerHTML = ''; var name = 'p13-' + Date.now();
    predBox.append(el('p.prose', 'Per un processo MA(1) l’autocorrelazione è nulla oltre il ritardo 1. Che cosa farà invece l’autocorrelazione parziale?'),
      el('div.choices', { role: 'radiogroup' }, [['cut', 'Si annulla anch’essa dopo il ritardo 1'], ['decay', 'Decresce gradualmente, senza annullarsi'], ['const', 'Resta costante']].map(function (o, i) {
        return el('div.choice', el('input', { type: 'radio', name: name, id: name + i, value: o[0], checked: S.pred === o[0], onchange: function () { S.pred = this.value; updateFeedback(); } }), el('label', { for: name + i }, o[1]));
      })));
    fbBox = el('div.feedback', { role: 'status', hidden: true }); predBox.appendChild(fbBox);
  }
  function updateFeedback() {
    if (!S.pred) { fbBox.hidden = true; return; }
    fbBox.hidden = false;
    fbBox.textContent = (S.pred === 'decay' ? '✓ ' : '✗ ') + 'È la dualità tra AR e MA: per un AR(p) la PACF si annulla dopo p e l’ACF decresce; per un MA(q) l’ACF si annulla dopo q e la PACF decresce (con segni alterni se θ > 0). Scegli il modello MA(1) e confronta i due grafici.';
  }
  function interpretation() {
    var st = stationary(S.p1, S.p2);
    interpBox.innerHTML = '<p>Ogni valore della serie è una combinazione dei valori passati (parte <strong>AR</strong>, coefficienti φ) e degli shock passati (parte <strong>MA</strong>, coefficiente θ), più uno shock nuovo. L’<strong>ACF</strong> misura la memoria complessiva, la <strong>PACF</strong> quella diretta, depurata dai ritardi intermedi.</p>' +
      (st ? '<p>Qui le radici reciproche del polinomio AR stanno dentro il cerchio unitario: il processo è <strong>stazionario</strong>, oscilla attorno a 0 con varianza costante, e le autocorrelazioni empiriche convergono a quelle teoriche. Più una radice è vicina al bordo, più lunga è la memoria e più osservazioni servono per stimarla.' + (S.p2 < 0 && S.p1 * S.p1 + 4 * S.p2 < 0 ? ' Radici complesse producono un andamento pseudo-ciclico.' : '') + '</p>'
        : '<p>Una radice reciproca sta fuori (o sul bordo) del cerchio: il processo <strong>non è stazionario</strong>. La serie esplode o vaga senza tornare, le autocorrelazioni teoriche non sono definite e quelle empiriche dipendono da T: non stimano nulla.</p>') +
      '<p class="muted">La banda ±1,96/√T vale per il rumore bianco: barre empiriche fuori dalla banda suggeriscono dipendenza, ma su 20 ritardi circa una esce per caso.</p>';
  }
  function codeR() {
    return ['# ───────────────────────────────────────────────────────────────', '# StatAtlas · Lab 13 — ARMA(2, 1): φ₁ = ' + S.p1 + ', φ₂ = ' + S.p2 + ', θ₁ = ' + S.th,
      '# Generazione esplicita (non arima.sim) per avere gli stessi numeri di StatAtlas.', '# ───────────────────────────────────────────────────────────────',
      'library(tidyverse)', '', 'set.seed(' + S.seed + ')', 'phi <- c(' + S.p1 + ', ' + S.p2 + '); theta <- ' + S.th + '; T <- ' + S.T + '; burn <- ' + BURN, '',
      'e <- rnorm(burn + T)', 'x <- numeric(burn + T)', 'for (t in seq_along(x)) {',
      '  x1 <- if (t > 1) x[t - 1] else 0; x2 <- if (t > 2) x[t - 2] else 0; e1 <- if (t > 1) e[t - 1] else 0',
      '  x[t] <- phi[1] * x1 + phi[2] * x2 + e[t] + theta * e1', '}', 'x <- x[-seq_len(burn)]   # scarta il riscaldamento', '',
      '# Stazionarietà e invertibilità: moduli delle radici (devono superare 1)',
      'Mod(polyroot(c(1, -phi)))', 'abs(theta) < 1', '',
      '# ACF e PACF: empiriche e teoriche',
      'confronto <- tibble(ritardo = 1:' + LAGS + ',',
      '  acf_emp  = acf(x, lag.max = ' + LAGS + ', plot = FALSE)$acf[-1],',
      '  acf_teo  = ARMAacf(ar = phi, ma = theta, lag.max = ' + LAGS + ')[-1],',
      '  pacf_emp = pacf(x, lag.max = ' + LAGS + ', plot = FALSE)$acf[, 1, 1],',
      '  pacf_teo = ARMAacf(ar = phi, ma = theta, lag.max = ' + LAGS + ', pacf = TRUE))', 'confronto', '',
      '# Stima di massima verosimiglianza del modello che ha generato i dati',
      'arima(x, order = c(2, 0, 1), include.mean = FALSE)', '',
      'theme_statatlas <- function(base_size = 12) {', '  theme_minimal(base_size = base_size, base_family = "serif") +',
      '    theme(panel.grid.minor = element_blank(), legend.position = "top",', '          plot.background = element_rect(fill = "#FAF8F3", colour = NA))', '}', '',
      'tibble(t = seq_along(x), x = x) |> ggplot(aes(t, x)) + geom_line(colour = "#0072B2") + theme_statatlas()',
      'confronto |>', '  pivot_longer(-ritardo, names_to = c("funzione", "tipo"), names_sep = "_") |>',
      '  ggplot(aes(ritardo, value, colour = tipo)) +', '  geom_hline(yintercept = c(-1, 1) * 1.96 / sqrt(T), linetype = "dashed", colour = "grey60") +',
      '  geom_point() + geom_line() + facet_wrap(~ funzione) +', '  scale_colour_manual(values = c(emp = "#0072B2", teo = "#D55E00")) +', '  labs(y = NULL) + theme_statatlas()', ''].join('\n');
  }
  var THEORY = {
    base: function () {
      return el('div.prose', { html: '<h3>Il modello</h3><div class="eq">Xₜ = φ₁Xₜ₋₁ + φ₂Xₜ₋₂ + εₜ + θ₁εₜ₋₁, &nbsp; εₜ rumore bianco N(0, 1)</div>' +
        '<h3>Stazionarietà</h3><p>Il processo è stazionario se le radici di 1 − φ₁z − φ₂z² stanno fuori dal cerchio unitario (equivalentemente, le reciproche dentro). Per l’AR(2): φ₁ + φ₂ &lt; 1, φ₂ − φ₁ &lt; 1, |φ₂| &lt; 1.</p>' +
        '<h3>Riconoscere il modello</h3><table class="tv"><thead><tr><th></th><th>ACF</th><th>PACF</th></tr></thead><tbody><tr><td>AR(p)</td><td>decresce</td><td>zero dopo p</td></tr><tr><td>MA(q)</td><td>zero dopo q</td><td>decresce</td></tr><tr><td>ARMA</td><td>decresce</td><td>decresce</td></tr></tbody></table>' +
        '<div class="callout warn">Il riscaldamento (burn-in) serve a dimenticare il valore iniziale arbitrario xₜ = 0: senza, i primi valori non seguono la legge stazionaria.</div>' });
    },
    adv: function () {
      return el('div.prose', { html: '<h3>Rappresentazione MA(∞)</h3><p>Se il processo è stazionario Xₜ = Σ ψⱼ εₜ₋ⱼ con ψ₀ = 1, ψ₁ = φ₁ + θ₁, ψⱼ = φ₁ψⱼ₋₁ + φ₂ψⱼ₋₂. Allora γ(h) = Σ ψⱼψⱼ₊ₕ: è così che StatAtlas calcola l’ACF teorica.</p>' +
        '<h3>Durbin–Levinson</h3><p>La PACF φₖₖ è l’ultimo coefficiente della migliore previsione lineare di Xₜ da Xₜ₋₁, …, Xₜ₋ₖ, e si ottiene ricorsivamente dalle autocorrelazioni.</p>' +
        '<h3>Invertibilità</h3><p>Se |θ₁| &lt; 1 gli shock si ricostruiscono dalle osservazioni passate (εₜ = Σ (−θ₁)ʲ …). Per |θ₁| &gt; 1 esiste un modello invertibile con θ₁ sostituito da 1/θ₁ e la stessa ACF: senza la condizione il modello non è identificabile.</p>' +
        '<h3>Distribuzione delle autocorrelazioni empiriche</h3><p>Per rumore bianco ρ̂(h) ≈ N(0, 1/T) (da qui la banda). Per un processo generico la varianza è data dalla formula di Bartlett e dipende da tutte le autocorrelazioni: con memoria lunga la ρ̂ è molto più variabile, ed è distorta verso zero per T finito.</p>' });
    }
  };

  var run, ctrlBox;
  function restart() { run.stop(); S = newState(S); legends(); interpretation(); codeBox.refresh(); render(true); run.refresh(); }
  function render(full) { drawSeries(); if (full || run.frame % 3 === 0 || !run.running) { drawCorr(figB, 'acf'); drawCorr(figC, 'pacf'); drawRoots(); updateTable(); } }
  function buildControls() {
    ctrlBox.innerHTML = '';
    var sl = function (lab, key, mn, mx) { return SA.ui.slider(lab, { min: mn, max: mx, step: 0.02, value: S[key], format: function (v) { return SA.fmt(v, 2); }, onchange: function (v) { S[key] = v; S.preset = 'custom'; buildControls(); restart(); } }); };
    ctrlBox.append(
      el('label.field', el('span', 'Modello di partenza'), el('select', { onchange: function () { var p = PRESETS[this.value]; S.preset = this.value; S.p1 = p.p1; S.p2 = p.p2; S.th = p.th; buildControls(); restart(); } },
        [el('option', { value: 'custom', selected: S.preset === 'custom' }, 'Personalizzato')].concat(Object.keys(PRESETS).map(function (k) { return el('option', { value: k, selected: k === S.preset }, PRESETS[k].label); })))),
      sl('φ₁', 'p1', -2, 2), sl('φ₂', 'p2', -1, 1), sl('θ₁', 'th', -1.5, 1.5),
      el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px' },
        el('label.field', el('span', 'Lunghezza T'), el('select', { onchange: function () { S.T = +this.value; restart(); } }, [100, 400, 1000, 3000].map(function (v) { return el('option', { value: v, selected: v === S.T }, String(v)); }))),
        el('label.field', el('span', 'Seed'), el('input', { type: 'number', value: S.seed, min: 1, onchange: function () { S.seed = Math.max(1, Math.floor(+this.value || 1)); restart(); } }))));
    run.controls('Un istante').forEach(function (n) { ctrlBox.appendChild(n); });
  }

  SA.registerLab('arma', {
    mount: function (page, info) {
      el = SA.ui.el; S = newState(S);
      run = SA.ui.runner({ speed: 2, step: step, render: render, done: function () { return S.k >= S.T; }, progress: function () { return S.k / S.T; }, reset: function () { S = newState(S); } });
      var openT = function (l) { SA.ui.openDrawer('Serie temporali ARMA', THEORY, l); };
      page.appendChild(el('header.lab-head', el('div', el('div.kicker', info.part.part + ' · ' + info.part.title + ' · Laboratorio ' + info.lab.num),
        el('h1', info.lab.title), el('p.lede', 'Dati che ricordano il proprio passato. La memoria si legge nelle autocorrelazioni, e la stabilità nelle radici di un polinomio.')),
        SA.ui.button('Approfondisci', { icon: 'book', onclick: function () { openT(); } })));
      var s1 = SA.ui.step('1', 'Domanda'); s1.body.appendChild(el('p.question', 'Come si riconosce dalla sola serie osservata il meccanismo che l’ha generata?'));
      var s2 = SA.ui.step('2', 'La tua previsione'); predBox = el('div'); s2.body.appendChild(predBox);
      var s3 = SA.ui.step('3', 'Esperimento', 'Una serie che cresce un istante alla volta');
      ctrlBox = el('div.panel.controls'); figA = el('div'); figB = el('div'); figC = el('div'); figD = el('div'); legA = el('div.legend'); legB = el('div.legend');
      s3.body.appendChild(el('div.lab-grid', ctrlBox, el('div.figure',
        el('div.fig', el('div.fig-title', el('h3', 'La serie'), legA), figA),
        el('div.fig', el('div.fig-title', el('h3', 'Memoria della serie'), legB),
          el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px' },
            el('div', el('div.muted', { style: 'font-size:.8rem;margin-bottom:2px' }, 'ACF'), figB), el('div', el('div.muted', { style: 'font-size:.8rem;margin-bottom:2px' }, 'PACF'), figC),
            el('div', el('div.muted', { style: 'font-size:.8rem;margin-bottom:2px' }, 'Radici reciproche: dentro il cerchio = stazionario/invertibile'), figD))),
        el('div.toolbar', SA.ui.button('Dati CSV', { icon: 'download', cls: 'btn-ghost', onclick: function () {
          var rows = [['t', 'x']]; for (var i = 0; i < S.k; i++) rows.push([i + 1, S.x[i]]); SA.ui.download('statatlas_lab13_seed' + S.seed + '.csv', SA.ui.csv(rows), 'text/csv'); } }),
          SA.ui.button('Figura PNG', { icon: 'download', cls: 'btn-ghost', onclick: function () { SA.ui.exportPNG([figA.querySelector('svg'), figB.querySelector('svg'), figC.querySelector('svg')], 'statatlas_lab13.png', ['ARMA(2, 1): φ₁ = ' + S.p1 + ', φ₂ = ' + S.p2 + ', θ₁ = ' + S.th, 'T = ' + S.k + ' · seed ' + S.seed]); } })))));
      var s4 = SA.ui.step('4', 'Teoria e simulazione a confronto'); tblBody = el('tbody'); kpiBox = el('div.kpis');
      s4.body.append(el('div.tbl-wrap', el('table.tv', el('thead', el('tr', el('th', 'Quantità'), el('th', 'Teoria'), el('th', 'Serie simulata'), el('th', 'Natura'))), tblBody)), kpiBox);
      var s5 = SA.ui.step('5', 'Interpretazione'); interpBox = el('div.prose');
      s5.body.append(interpBox, el('p', el('button.btn.btn-ghost', { type: 'button', onclick: function () { openT('adv'); } }, SA.ui.icon('book'), ' Pesi ψ, Durbin–Levinson, invertibilità e Bartlett (livello avanzato)')));
      var s6 = SA.ui.step('6', 'Riproduci in R', 'Stessa ricorsione, stesse innovazioni'); codeBox = SA.ui.codeBlock(codeR, 'statatlas_lab13_arma.R');
      s6.body.append(el('p.prose', 'Usa ARMAacf() per la teoria e arima() per la stima. Richiede R ≥ 4.1 e tidyverse.'), codeBox);
      page.append(s1, s2, s3, s4, s5, s6);
      buildControls(); buildPrediction(); legends(); interpretation(); render(true); run.refresh();
      document.addEventListener('keydown', run.key);
    },
    unmount: function () { run.stop(); document.removeEventListener('keydown', run.key); },
    redraw: function () { legends(); render(true); }
  });
})();

</script>
<script>SA.start();</script>

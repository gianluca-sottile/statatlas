/* labs/06-stimatori.js */
/* StatAtlas · Lab 06 — Media, mediana e massima verosimiglianza
 * Idea ispirata a Simul2000 (M. Chiodi): confronto di stimatori sugli stessi campioni.
 * Implementazione e testi originali. */
(function () {
  var THETA = 0, BINS = 48, SQ2PI = Math.sqrt(2 * Math.PI);
  var N_VALUES = [5, 10, 15, 20, 30, 50, 100, 200];
  var SPEEDS = [ // [repliche per passo, frame tra passi]
    { label: 'Lenta', per: 1, every: 20 }, { label: 'Media', per: 1, every: 4 },
    { label: 'Veloce', per: 3, every: 1 }, { label: 'Turbo', per: 25, every: 1 }];

  var EST = {
    mean:   { r: 'media',   label: 'Media',   long: 'Media campionaria',   col: 'c1', dash: null,    shape: 'tri' },
    median: { r: 'mediana', label: 'Mediana', long: 'Mediana campionaria', col: 'c2', dash: '7 4',   shape: 'diamond' },
    mle:    { r: 'mle',     label: 'MLE',     long: 'Massima verosimiglianza (numerica)', col: 'c3', dash: '2 3', shape: 'circle' }
  };

  /* Ogni modello: generatore identico a R, densità, stimatori e leggi teoriche */
  var MODELS = {
    normal: {
      label: 'Normale', law: 'N(θ, 1)', est: ['mean', 'median'], mleIs: 'mean',
      gen: function (g, n) { return g.rnorm(n, THETA, 1); },
      dens: function (x) { return SA.dens.norm(x, THETA, 1); },
      rGen: 'genera <- function(n) rnorm(n, mean = theta, sd = 1)',
      theory: function (n) { return {
        mean:   { sd: Math.sqrt(1 / n), st: 'exact', r: 'dnorm(x, theta, sqrt(1 / n))', txt: '1/√n' },
        median: { sd: Math.sqrt(Math.PI / (2 * n)), st: 'asym', r: 'dnorm(x, theta, sqrt(pi / (2 * n)))', txt: '√(π/(2n))' } }; },
      are: { a: 'median', b: 'mean', val: 2 / Math.PI, txt: '2/π' }
    },
    laplace: {
      label: 'Laplace', law: 'Laplace(θ, 1)', est: ['mean', 'median'], mleIs: 'median',
      gen: function (g, n) { return g.rlaplace(n, THETA, 1); },
      dens: function (x) { return SA.dens.laplace(x, THETA, 1); },
      rGen: '# Laplace(θ, b) per inversione: la stessa formula usata nel browser\n' +
        'rlaplace <- function(n, theta = 0, b = 1) {\n  u <- runif(n) - 0.5\n  theta - b * sign(u) * log(1 - 2 * abs(u))\n}\n' +
        'genera <- function(n) rlaplace(n, theta = theta, b = 1)',
      theory: function (n) { return {
        mean:   { sd: Math.sqrt(2 / n), st: 'asym', r: 'dnorm(x, theta, sqrt(2 / n))', txt: '√(2/n)' },
        median: { sd: Math.sqrt(1 / n), st: 'asym', r: 'dnorm(x, theta, sqrt(1 / n))', txt: '1/√n' } }; },
      are: { a: 'median', b: 'mean', val: 2, txt: '2' }
    },
    cauchy: {
      label: 'Cauchy', law: 'Cauchy(θ, 1)', est: ['mean', 'median', 'mle'], mleIs: null,
      gen: function (g, n) { return g.rcauchy(n, THETA, 1); },
      dens: function (x) { return SA.dens.cauchy(x, THETA, 1); },
      rGen: 'genera <- function(n) rcauchy(n, location = theta, scale = 1)\n\n' +
        '# MLE della posizione (scala nota = 1): algoritmo MM/IRLS dalla mediana.\n' +
        '# Ogni passo aumenta la verosimiglianza; converge a un massimo locale.\n' +
        'mle_cauchy <- function(x, tol = 1e-10, maxit = 100) {\n  theta_k <- median(x)\n  for (i in seq_len(maxit)) {\n' +
        '    w <- 1 / (1 + (x - theta_k)^2)\n    theta_new <- sum(w * x) / sum(w)\n    if (abs(theta_new - theta_k) < tol) break\n' +
        '    theta_k <- theta_new\n  }\n  theta_new\n}',
      theory: function (n) { return {
        mean:   { sd: Infinity, cauchy: true, st: 'exact', r: 'dcauchy(x, theta, 1)', txt: 'non esiste' },
        median: { sd: Math.PI / (2 * Math.sqrt(n)), st: 'asym', r: 'dnorm(x, theta, pi / (2 * sqrt(n)))', txt: 'π/(2√n)' },
        mle:    { sd: Math.sqrt(2 / n), st: 'asym', r: 'dnorm(x, theta, sqrt(2 / n))', txt: '√(2/n)' } }; },
      are: { a: 'median', b: 'mle', val: 8 / (Math.PI * Math.PI), txt: '8/π²' }
    }
  };

  var el, S; // stato

  function newState(prev) {
    var s = { model: 'normal', nIdx: 3, M: 1000, seed: 2026, speed: 1, prediction: null };
    if (prev) ['model', 'nIdx', 'M', 'seed', 'speed', 'prediction'].forEach(function (k) { s[k] = prev[k]; });
    s.n = N_VALUES[s.nIdx];
    s.rng = new SA.RRNG(s.seed);
    s.k = 0; s.running = false; s.frame = 0; s.last = null;
    s.est = {}; s.bins = {}; s.out = {};
    var th = MODELS[s.model].theory(s.n), maxVar = 0;
    MODELS[s.model].est.forEach(function (e) {
      s.est[e] = new Float64Array(s.M); s.bins[e] = new Uint32Array(BINS); s.out[e] = 0;
      if (isFinite(th[e].sd)) maxVar = Math.max(maxVar, th[e].sd * th[e].sd);
    });
    s.lim = +(4.5 * Math.sqrt(maxVar)).toFixed(4);
    s.th = th;
    return s;
  }

  function replicate() {
    if (S.k >= S.M) return false;
    var x = MODELS[S.model].gen(S.rng, S.n), vals = {};
    vals.mean = SA.stat.mean(x); vals.median = SA.stat.median(x);
    if (S.est.mle) vals.mle = SA.stat.mleCauchy(x);
    var bw = 2 * S.lim / BINS;
    for (var e in S.est) {
      var v = vals[e]; S.est[e][S.k] = v;
      var b = Math.floor((v - (THETA - S.lim)) / bw);
      if (b >= 0 && b < BINS) S.bins[e][b]++; else S.out[e]++;
    }
    S.last = { x: x, vals: vals };
    S.k++;
    return true;
  }

  /* ---------- grafici ---------- */
  var figSample, figDist, legendBox;

  function drawSample() {
    var W = 720, H = 168, X0 = -6, X1 = 6;
    var f = SA.plot.frame(figSample, { W: W, H: H, x: [X0, X1], m: { t: 10, r: 18, b: 40, l: 18 }, xlabel: 'x', label: 'Campione corrente' });
    var P = SA.plot, t = f.t, g = f.g, bandTop = 14, bandBot = 92, estY = 112;
    // densità del modello come sagoma di fondo
    var pk = MODELS[S.model].dens(THETA), pts = [];
    for (var i = 0; i <= 200; i++) { var xx = X0 + (X1 - X0) * i / 200; pts.push([f.x(xx), bandBot - (bandBot - bandTop) * MODELS[S.model].dens(xx) / pk]); }
    P.svg('path', { d: P.path(pts) + 'L' + f.x(X1) + ',' + bandBot + 'L' + f.x(X0) + ',' + bandBot + 'Z', fill: t.paper_2, stroke: t.rule_2 }, g);
    P.svg('line', { x1: f.x(THETA), x2: f.x(THETA), y1: bandTop - 4, y2: estY + 10, stroke: t.ink, 'stroke-dasharray': '3 3' }, g);
    var lab = P.svg('text', { x: f.x(THETA) + 4, y: bandTop + 4, fill: t.ink_2, 'font-family': t.serif, 'font-style': 'italic', 'font-size': 13 }, g);
    lab.textContent = 'θ';
    if (!S.last) {
      var msg = P.svg('text', { x: W / 2, y: 60, 'text-anchor': 'middle', fill: t.ink_3, 'font-size': 13 }, g);
      msg.textContent = 'Premi ▶ o “passo” per estrarre il primo campione';
      return;
    }
    var x = S.last.x, left = 0, right = 0;
    for (var j = 0; j < x.length; j++) {
      if (x[j] < X0) { left++; continue; } if (x[j] > X1) { right++; continue; }
      var jit = ((j * 0.6180339887) % 1);
      P.svg('circle', { cx: f.x(x[j]), cy: bandTop + 18 + jit * (bandBot - bandTop - 26), r: 3.6, fill: t.ink, 'fill-opacity': 0.55, stroke: t.card, 'stroke-width': 0.8 }, g);
    }
    function edgeNote(cnt, side) {
      if (!cnt) return;
      var tx = P.svg('text', { x: side < 0 ? f.x(X0) : f.x(X1), y: bandTop + 6, 'text-anchor': side < 0 ? 'start' : 'end', fill: t.accent, 'font-size': 11, 'font-weight': 600 }, g);
      tx.textContent = side < 0 ? '◂ ' + cnt + ' fuori' : cnt + ' fuori ▸';
    }
    edgeNote(left, -1); edgeNote(right, 1);
    P.svg('line', { x1: f.x(X0), x2: f.x(X1), y1: estY, y2: estY, stroke: t.rule }, g);
    MODELS[S.model].est.forEach(function (e) {
      var v = S.last.vals[e], c = t[EST[e].col], cx = f.x(Math.max(X0, Math.min(X1, v)));
      P.svg('line', { x1: cx, x2: cx, y1: bandTop, y2: estY, stroke: c, 'stroke-width': 1.6, 'stroke-dasharray': EST[e].dash }, g);
      P.marker(g, EST[e].shape, cx, estY, 12, c, t.card);
    });
  }

  function drawDist() {
    var lim = S.lim, x0 = THETA - lim, x1 = THETA + lim, bw = 2 * lim / BINS, peak = 0;
    MODELS[S.model].est.forEach(function (e) {
      var th = S.th[e]; peak = Math.max(peak, th.cauchy ? 1 / Math.PI : 1 / (th.sd * SQ2PI));
    });
    var ymax = +(peak * 1.3).toPrecision(2);
    var f = SA.plot.frame(figDist, { W: 720, H: 300, x: [x0, x1], y: [0, ymax], xlabel: 'stima di θ', ylabel: 'densità', label: 'Distribuzioni campionarie degli stimatori' });
    var P = SA.plot, t = f.t, g = f.g, yb = f.y(0);
    P.svg('line', { x1: f.x(THETA), x2: f.x(THETA), y1: f.m.t, y2: yb, stroke: t.ink, 'stroke-dasharray': '3 3' }, g);
    var order = MODELS[S.model].est;
    // istogrammi (simulazione)
    if (S.k > 0) order.forEach(function (e) {
      var c = t[EST[e].col], d = 'M' + f.x(x0).toFixed(1) + ',' + yb.toFixed(1);
      for (var b = 0; b < BINS; b++) {
        var h = Math.max(f.m.t, f.y(S.bins[e][b] / (S.k * bw)));
        d += 'L' + f.x(x0 + b * bw).toFixed(1) + ',' + h.toFixed(1) + 'L' + f.x(x0 + (b + 1) * bw).toFixed(1) + ',' + h.toFixed(1);
      }
      d += 'L' + f.x(x1).toFixed(1) + ',' + yb.toFixed(1) + 'Z';
      P.svg('path', { d: d, fill: c, 'fill-opacity': 0.12, stroke: c, 'stroke-opacity': 0.7, 'stroke-width': 1 }, g);
    });
    // curve teoriche
    order.forEach(function (e) {
      var th = S.th[e], pts = [];
      for (var i = 0; i <= 240; i++) {
        var xx = x0 + (x1 - x0) * i / 240;
        var dv = th.cauchy ? SA.dens.cauchy(xx, THETA, 1) : SA.dens.norm(xx, THETA, th.sd);
        pts.push([f.x(xx), Math.max(f.m.t, f.y(dv))]);
      }
      P.svg('path', { d: P.path(pts), fill: 'none', stroke: t[EST[e].col], 'stroke-width': 2.4, 'stroke-dasharray': EST[e].dash, 'stroke-linejoin': 'round' }, g);
    });
    // stime fuori scala
    var notes = order.filter(function (e) { return S.out[e] > 0; }).map(function (e) {
      return EST[e].label.toLowerCase() + ' ' + S.out[e] + ' (' + SA.fmt(100 * S.out[e] / S.k, 1) + '%)';
    });
    if (notes.length) {
      var tx = P.svg('text', { x: f.W - f.m.r, y: f.m.t + 12, 'text-anchor': 'end', fill: t.accent, 'font-size': 11.5, 'font-weight': 600 }, g);
      tx.textContent = 'Fuori scala: ' + notes.join(' · ');
    }
    var cnt = P.svg('text', { x: f.m.l + 8, y: f.m.t + 12, fill: t.ink_3, 'font-size': 11.5 }, g);
    cnt.textContent = S.k + ' campioni su ' + S.M;
  }

  function buildLegend() {
    var t = SA.theme();
    legendBox.innerHTML = '';
    MODELS[S.model].est.forEach(function (e) {
      legendBox.appendChild(el('span', SA.plot.legendSwatch(t[EST[e].col], EST[e].dash, EST[e].shape), EST[e].label));
    });
    legendBox.appendChild(el('span.muted', 'area: simulazione · curva: teoria'));
  }

  /* ---------- tabella teoria vs simulazione ---------- */
  var tblBody, kpiBox, fbBox, interpBox;
  function summary() {
    var out = {};
    MODELS[S.model].est.forEach(function (e) {
      var v = S.est[e].subarray(0, S.k), s = { k: S.k };
      if (S.k >= 2) {
        var srt = SA.stat.sorted(v), mse = 0;
        for (var i = 0; i < v.length; i++) mse += (v[i] - THETA) * (v[i] - THETA);
        s.center = SA.stat.quantile(srt, 0.5, true);
        s.iqr = SA.stat.quantile(srt, 0.75, true) - SA.stat.quantile(srt, 0.25, true);
        s.sd = SA.stat.sd(v); s.mse = mse / v.length;
      }
      out[e] = s;
    });
    return out;
  }
  function updateTable() {
    var sm = summary(), fmt = SA.fmt;
    tblBody.innerHTML = '';
    MODELS[S.model].est.forEach(function (e) {
      var th = S.th[e], s = sm[e], noVar = !isFinite(th.sd);
      var iqrT = th.cauchy ? 2 : 2 * 0.6744897502 * th.sd;
      var swatch = SA.plot.legendSwatch(SA.theme()[EST[e].col], EST[e].dash, EST[e].shape);
      var dag = noVar ? el('sup', { title: 'La varianza teorica non esiste: questo numero non converge al crescere delle repliche' }, '†') : null;
      tblBody.appendChild(el('tr',
        el('td', el('span.est', swatch, EST[e].label), MODELS[S.model].mleIs === e ? el('span.th', '= MLE in questo modello') : null),
        el('td', fmt(s.center), el('span.th', 'teoria ' + fmt(THETA))),
        el('td', fmt(s.sd), dag, el('span.th', 'teoria ' + (noVar ? 'non esiste' : fmt(th.sd) + ' = ' + th.txt))),
        el('td', fmt(s.iqr), el('span.th', 'teoria ' + fmt(iqrT))),
        el('td', fmt(s.mse), dag, el('span.th', noVar ? 'teoria: non esiste' : 'teoria ≈ ' + fmt(th.sd * th.sd))),
        el('td', SA.ui.badge(th.st))));
    });
    // efficienza relativa
    var are = MODELS[S.model].are, sa = sm[are.a], sb = sm[are.b];
    var effSim = sa && sb && sa.sd ? (sb.sd * sb.sd) / (sa.sd * sa.sd) : NaN;
    kpiBox.innerHTML = '';
    kpiBox.append(
      el('div.kpi', el('b', S.k + ' / ' + S.M), el('span', 'campioni generati')),
      el('div.kpi', el('b', fmt(are.val, 3)), el('span', 'efficienza asintotica ' + EST[are.a].label.toLowerCase() + ' vs ' + EST[are.b].label.toLowerCase() + ' = ' + are.txt + ' '), SA.ui.badge('asym')),
      el('div.kpi', el('b', fmt(effSim, 3)), el('span', 'stessa quantità stimata: Var(' + EST[are.b].label.toLowerCase() + ') / Var(' + EST[are.a].label.toLowerCase() + ') '), SA.ui.badge('mc')));
    updateFeedback(sm);
  }

  /* ---------- previsione ---------- */
  function predOptions() {
    var o = [['mean', 'La media'], ['median', 'La mediana']];
    if (S.model === 'cauchy') o.push(['mle', 'L’MLE numerico']);
    o.push(['tie', 'Sono praticamente equivalenti']);
    return o;
  }
  function updateFeedback(sm) {
    if (!S.prediction) { fbBox.hidden = true; return; }
    fbBox.hidden = false;
    if (S.k < 200) { fbBox.textContent = 'Previsione registrata. Il confronto compare dopo almeno 200 campioni (ora ' + S.k + ').'; return; }
    var ests = MODELS[S.model].est, best = ests[0];
    ests.forEach(function (e) { if (sm[e].iqr < sm[best].iqr) best = e; });
    var sortedIqr = ests.map(function (e) { return sm[e].iqr; }).sort(function (a, b) { return a - b; });
    var tie = sortedIqr[1] / sortedIqr[0] < 1.05;
    var right = (S.prediction === 'tie' && tie) || S.prediction === best;
    var msg = (right ? '✓ La simulazione conferma la tua previsione. ' : '✗ La simulazione dice altro. ') +
      'Lo stimatore più concentrato attorno a θ (scarto interquartile minore) è ' + EST[best].label.toLowerCase() + ': ' +
      ests.map(function (e) { return EST[e].label.toLowerCase() + ' ' + SA.fmt(sm[e].iqr); }).join(', ') + '.';
    fbBox.textContent = msg;
  }

  /* ---------- interpretazione ---------- */
  function interpretation() {
    var n = S.n, mc = ' Le quantità simulate sono stime Monte Carlo: con M = ' + S.M + ' repliche la deviazione standard simulata ha un errore relativo dell’ordine di 1/√(2M) ≈ ' + SA.fmt(100 / Math.sqrt(2 * S.M), 1) + '%.';
    var txt = {
      normal: '<p>Con dati normali la <strong>media</strong> è lo stimatore di massima verosimiglianza ed è esattamente N(θ, 1/n): raggiunge il limite di Cramér–Rao, e nessuno stimatore non distorto fa meglio. La <strong>mediana</strong> ha varianza asintotica π/(2n): per ottenere la stessa precisione servono circa π/2 ≈ 1,57 volte più osservazioni.</p><p><strong>Condizione:</strong> il vantaggio della media dipende dall’ipotesi di normalità. Basta una piccola quota di osservazioni da code pesanti per ribaltare il confronto: prova il modello Laplace o Cauchy.</p>',
      laplace: '<p>Con code esponenziali il confronto si ribalta. La <strong>mediana</strong> è lo stimatore di massima verosimiglianza (minimizza Σ|xᵢ − θ|) e ha varianza asintotica 1/n, la metà di quella della <strong>media</strong> (2/n). La media resta non distorta e asintoticamente normale per il teorema del limite centrale, ma spreca informazione.</p><p><strong>Attenzione:</strong> per n = ' + n + ' le curve teoriche sono approssimazioni asintotiche; con n piccolo la distribuzione della mediana non è ancora normale.</p>',
      cauchy: '<p>La media di n osservazioni Cauchy ha <em>ancora</em> legge Cauchy(θ, 1): non si concentra al crescere di n, perché E|X| = ∞ e la legge dei grandi numeri non si applica. Per questo la sua deviazione standard simulata (†) non converge: ogni tanto un valore enorme la fa saltare.</p><p>La <strong>mediana</strong> è consistente, con varianza asintotica π²/(4n). L’<strong>MLE</strong>, calcolato numericamente, fa meglio ancora (2/n, il limite di Cramér–Rao). La mediana <em>non</em> è l’MLE della Cauchy: qui è solo il punto di partenza dell’algoritmo, e l’equazione di verosimiglianza può avere più radici.</p>'
    };
    interpBox.innerHTML = txt[S.model] + '<p class="muted">' + mc + '</p>';
  }

  /* ---------- codice R ---------- */
  function codeR() {
    var m = MODELS[S.model], ests = m.est, th = S.th, f4 = function (v) { return (+v.toFixed(4)).toString(); };
    var est = ests.map(function (e) {
      var fn = e === 'mean' ? 'mean' : e === 'median' ? 'median' : 'mle_cauchy';
      return '    ' + EST[e].r + ' '.repeat(8 - EST[e].r.length) + '= map_dbl(campione, ' + fn + ')';
    }).join(',\n');
    var teo = ests.map(function (e) { return '    ' + EST[e].r + ' '.repeat(8 - EST[e].r.length) + '= ' + th[e].r; }).join(',\n');
    var teoSd = ests.map(function (e) { return EST[e].r + ' ' + (isFinite(th[e].sd) ? f4(th[e].sd) : 'non esiste (media ~ Cauchy(θ, 1))'); }).join(', ');
    var cols = ests.map(function (e) { return EST[e].r + ' = "' + { c1: '#0072B2', c2: '#D55E00', c3: '#009E73' }[EST[e].col] + '"'; }).join(', ');
    var mleNote = m.mleIs ? '\n# Nel modello ' + m.label + ' lo stimatore di massima verosimiglianza coincide con la ' + EST[m.mleIs].r + '.' : '';
    return [
      '# ───────────────────────────────────────────────────────────────',

  /* ---------- approfondimenti ---------- */
  var THEORY = {
    base: function () {

        '<p>Uno <strong>stimatore</strong> è una regola che trasforma il campione in un numero. Poiché il campione è casuale, anche la stima lo è: la sua legge si chiama <strong>distribuzione campionaria</strong>. Il laboratorio la costruisce ripetendo lo stesso esperimento M volte.</p>' +
        '<p>Tre domande guidano il confronto:</p><ul>' +
        '<li><strong>Centro</strong> — la distribuzione campionaria è centrata su θ? (distorsione)</li>' +
        '<li><strong>Dispersione</strong> — quanto si allarga attorno a θ? (varianza, errore quadratico medio, scarto interquartile)</li>' +
        '<li><strong>Robustezza</strong> — quanto cambia la stima se alcune osservazioni sono estreme?</li></ul>' +
        '<h3>Media e mediana</h3>' +
        '<p>La media usa il <em>valore</em> di ogni osservazione: una sola osservazione molto grande la sposta quanto vuole. La mediana usa solo l’<em>ordine</em>: resta stabile finché meno di metà dei dati è anomala. Si dice che la media ha punto di rottura (breakdown point) 0 e la mediana 50%.</p>' +
        '<h3>Efficienza relativa</h3>' +
        '<p>Se due stimatori sono centrati su θ, è più <strong>efficiente</strong> quello con varianza minore. Il rapporto delle varianze dice quante osservazioni in più servono al meno efficiente per uguagliare l’altro.</p>' +
        '<table class="tv"><thead><tr><th>Modello</th><th>Var(media)</th><th>Var(mediana)</th><th>Efficienza mediana/media</th></tr></thead><tbody>' +
        '<tr><td>Normale</td><td>1/n</td><td>≈ π/(2n)</td><td>2/π ≈ 0,64</td></tr>' +
        '<tr><td>Laplace</td><td>2/n</td><td>≈ 1/n</td><td>2</td></tr>' +

        '<h3>Normalità asintotica della mediana</h3>' +
        '<p>Se la densità <span class="m">f</span> è continua e positiva in θ (mediana della popolazione), allora</p>' +
        '<div class="eq">√n (M<sub>n</sub> − θ) &nbsp;→<sub>d</sub>&nbsp; N(0, 1 / (4 f(θ)²))</div>' +
        '<p>Idea della dimostrazione: M<sub>n</sub> ≤ θ + t/√n se e solo se almeno metà delle osservazioni cade sotto θ + t/√n. Il numero di tali osservazioni è binomiale con probabilità F(θ + t/√n) ≈ ½ + f(θ) t/√n; il teorema del limite centrale per la binomiale conclude.</p>' +
        '<p>Con f(θ) = 1/√(2π) (Normale) si ottiene π/(2n); con f(θ) = 1/2 (Laplace, b = 1) si ottiene 1/n; con f(θ) = 1/π (Cauchy) si ottiene π²/(4n).</p>' +
        '<h3>Laplace: la mediana è l’MLE</h3>' +
        '<div class="eq">ℓ(θ) = −n log 2b − (1/b) Σ |x<sub>i</sub> − θ|</div>' +
        '<p>Massimizzare ℓ equivale a minimizzare Σ|xᵢ − θ|, che ha minimo nella mediana campionaria. Per n pari ogni valore tra le due osservazioni centrali è un MLE: la convenzione usuale prende il punto medio. ℓ non è derivabile nelle osservazioni, ma l’informazione di Fisher esiste e vale I(θ) = 1/b², per cui la mediana raggiunge il limite 1/n.</p>' +
        '<h3>Cauchy: perché la media non funziona</h3>' +
        '<p>La funzione caratteristica è φ(t) = exp(iθt − |t|). Per la media di n osservazioni indipendenti</p>' +
        '<div class="eq">φ<sub>X̄</sub>(t) = φ(t/n)<sup>n</sup> = exp(iθt − |t|)</div>' +

/* StatAtlas · Lab 07 — Verosimiglianza e informazione di Fisher.
 * Dieci modelli a un parametro (gli altri noti), dalla v0.8 di StatAtlas. */
(function () {
  var el, S, LAWS = SA.laws, BINS = 40, lg = SA.sf.lgamma, CUT = 1.920729; // qchisq(0.95, 1) / 2

  var dgam = function (x, a, r) { return x <= 0 ? 0 : Math.exp(a * Math.log(r) + (a - 1) * Math.log(x) - r * x - lg(a)); };
  var inv = function (id, p) { return function (g, n) { var o = new Float64Array(n), L = LAWS.get(id); for (var i = 0; i < n; i++) o[i] = L.q(g.unif(), p(S.theta)); return o; }; };
  var KG = 2, KW = 1.5; // forme note di Gamma e Weibull

  var MODELS = {
    normMean: { label: 'Normale: media μ (σ = 1 nota)', par: 'μ', min: -3, max: 3, step: 0.1, def: 0.5, pos: false,
      gen: function (g, n) { return g.rnorm(n, S.theta, 1); }, rgen: 'rnorm(n, mean = theta, sd = 1)',
      ll: function (t, x) { return -0.5 * sum(x, function (v) { return (v - t) * (v - t); }); },
      U: function (t, x) { return sum(x) - x.length * t; }, J: function (t, x) { return x.length; },
      mle: function (x) { return SA.stat.mean(x); }, I: function () { return 1; },

  function interpretation() {
    var m = M(), txt = '<p>Il grafico in alto è la log-verosimiglianza <strong>di un solo campione</strong>: una funzione del parametro, non una densità. Il suo massimo è la stima θ̂; la sua <strong>curvatura</strong> nel massimo, J(θ̂), misura quanta informazione il campione porta su θ. Più è appuntita, più la stima è precisa.</p>';

    else txt += '<p>Ripetendo l’esperimento, lo <strong>score</strong> U(θ) nel vero valore ha media 0 e varianza n I(θ), e la curvatura media è anch’essa n I(θ): sono le identità di Bartlett, verificate dalla tabella. Ne segue che θ̂ è approssimativamente N(θ, 1/(n I(θ))), e nessuno stimatore non distorto ha varianza minore del limite di Cramér–Rao.</p>' +
      (S.model === 'cauchy' ? '<p>Nella Cauchy la log-verosimiglianza può avere più massimi locali e J(θ̂) di un campione può essere molto diversa da n/2: l’intervallo del rapporto di verosimiglianza è più affidabile di quello di Wald.</p>' : '') +
      (S.model === 'exp' || S.model === 'gamma' ? '<p>Qui θ̂ è distorto per n finito (la media esatta supera θ) e la legge esatta è asimmetrica: la normalità è solo asintotica. La distorsione svanisce come 1/n.</p>' : '');

  function codeR() {

  var THEORY = {

        '<h3>Normalità asintotica</h3><p>Sviluppando 0 = U(θ̂) ≈ U(θ) − J(θ)(θ̂ − θ): √n(θ̂ − θ) ≈ [U(θ)/√n] / [J(θ)/n] → N(0, I(θ)) / I(θ) = N(0, 1/I(θ)), per TCL sul numeratore e legge dei grandi numeri sul denominatore.</p>' +

      s6.body.append(el('p.prose', 'Richiede R ≥ 4.1 e tidyverse.'), codeBox);

/* StatAtlas · Lab 08 — Intervalli di confidenza: copertura nominale, esatta e osservata */
(function () {
  var el, S, LAWS = SA.laws, SHOW = 40;
  var tq = function (p, df) { return LAWS.get('t').q(p, { df: df }); };

      ci: function (x, a) { var m = SA.stat.mean(x), h = SA.qnorm(1 - a / 2) * S.sigma / Math.sqrt(x.length); return [m - h, m + h]; },
      formula: 'x̄ ± z<sub>1−α/2</sub> σ/√n', r: 'z <- qnorm(1 - a / 2)\n  mean(x) + c(-1, 1) * z * sigma / sqrt(n)' },
    t: { label: 'Media normale, σ ignota (t)', par: 'μ', model: 'norm', st: 'exact',
      ci: function (x, a) { var n = x.length, m = SA.stat.mean(x), h = tq(1 - a / 2, n - 1) * SA.stat.sd(x) / Math.sqrt(n); return [m - h, m + h]; },
      formula: 'x̄ ± t<sub>n−1, 1−α/2</sub> s/√n', r: 'mean(x) + c(-1, 1) * qt(1 - a / 2, n - 1) * sd(x) / sqrt(n)' },
    wald: { label: 'Proporzione: Wald', par: 'p', model: 'bern', st: 'asym',
      ci: function (x, a) { var n = x.length, p = SA.stat.mean(x), h = SA.qnorm(1 - a / 2) * Math.sqrt(p * (1 - p) / n); return [p - h, p + h]; },
      ciS: function (s, n, a) { var p = s / n, h = SA.qnorm(1 - a / 2) * Math.sqrt(p * (1 - p) / n); return [p - h, p + h]; },
      formula: 'p̂ ± z<sub>1−α/2</sub> √(p̂(1 − p̂)/n)', r: 'p <- mean(x); z <- qnorm(1 - a / 2)\n  p + c(-1, 1) * z * sqrt(p * (1 - p) / n)' },
    wilson: { label: 'Proporzione: Wilson', par: 'p', model: 'bern', st: 'asym',
      ci: function (x, a) { return METHODS.wilson.ciS(x.reduce(function (s, v) { return s + v; }, 0), x.length, a); },
      ciS: function (s, n, a) {
        var p = s / n, z = SA.qnorm(1 - a / 2), den = 1 + z * z / n, c = (p + z * z / (2 * n)) / den, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / den;
        return [Math.max(0, c - h), Math.min(1, c + h)];
      },
      formula: '[p̂ + z²/(2n) ± z √(p̂(1 − p̂)/n + z²/(4n²))] / (1 + z²/n)',
      r: 'p <- mean(x); z <- qnorm(1 - a / 2); den <- 1 + z^2 / n\n  ctr <- (p + z^2 / (2 * n)) / den\n  h <- z * sqrt(p * (1 - p) / n + z^2 / (4 * n^2)) / den\n  c(max(0, ctr - h), min(1, ctr + h))' },
    garwood: { label: 'Media Poisson: Garwood (esatto)', par: 'λ', model: 'pois', st: 'exact',
      ci: function (x, a) { return METHODS.garwood.ciS(x.reduce(function (s, v) { return s + v; }, 0), x.length, a); },
      ciS: function (s, n, a) { return [s === 0 ? 0 : cq(a / 2, 2 * s) / (2 * n), cq(1 - a / 2, 2 * s + 2) / (2 * n)]; },
      formula: '[χ²<sub>2S, α/2</sub> / (2n), χ²<sub>2S+2, 1−α/2</sub> / (2n)], &nbsp;S = Σxᵢ',
      r: 's <- sum(x)\n  c(if (s == 0) 0 else qchisq(a / 2, 2 * s) / (2 * n), qchisq(1 - a / 2, 2 * s + 2) / (2 * n))' },
    exp: { label: 'Tasso esponenziale: pivot χ²', par: 'λ', model: 'exp', st: 'exact',
      ci: function (x, a) { var n = x.length, s = x.reduce(function (t, v) { return t + v; }, 0); return [cq(a / 2, 2 * n) / (2 * s), cq(1 - a / 2, 2 * n) / (2 * s)]; },
      formula: '[χ²<sub>2n, α/2</sub>, χ²<sub>2n, 1−α/2</sub>] / (2 Σxᵢ)', r: 's <- sum(x)\n  c(qchisq(a / 2, 2 * n), qchisq(1 - a / 2, 2 * n)) / (2 * s)' }
  };
  var MODELS = {
    norm: { gen: function (g, n) { return g.rnorm(n, S.mu, S.sigma); }, truth: function () { return S.mu; }, se: function (n) { return S.sigma / Math.sqrt(n); }, r: function () { return 'rnorm(n, mean = ' + S.mu + ', sd = ' + S.sigma + ')'; } },
    bern: { gen: function (g, n) { var o = new Float64Array(n); for (var i = 0; i < n; i++) o[i] = LAWS.get('bern').q(g.unif(), { prob: S.p }); return o; }, truth: function () { return S.p; }, se: function (n) { return Math.sqrt(S.p * (1 - S.p) / n); }, r: function () { return 'qbinom(runif(n), size = 1, prob = ' + S.p + ')'; } },
    pois: { gen: function (g, n) { var o = new Float64Array(n); for (var i = 0; i < n; i++) o[i] = LAWS.get('pois').q(g.unif(), { lambda: S.lambda }); return o; }, truth: function () { return S.lambda; }, se: function (n) { return Math.sqrt(S.lambda / n); }, r: function () { return 'qpois(runif(n), lambda = ' + S.lambda + ')'; } },
    exp: { gen: function (g, n) { var o = new Float64Array(n); for (var i = 0; i < n; i++) o[i] = -Math.log1p(-g.unif()) / S.rate; return o; }, truth: function () { return S.rate; }, se: function (n) { return S.rate / Math.sqrt(n); }, r: function () { return 'qexp(runif(n), rate = ' + S.rate + ')'; } }

  function newState(prev) {

  var THEORY = {

/* StatAtlas · Lab 15 — Regressione penalizzata: ridge, lasso, elastic net.
 * Vista 1: spazio delle soluzioni in (β₁, β₂). Vista 2: percorsi di regolarizzazione e
 * scomposizione distorsione²–varianza per p = 8 predittori (discesa coordinata, obiettivo di glmnet). */

  /* ---------- vista 1: geometria in due dimensioni ---------- */
  // Q(b) = ½ (b − β̂)ᵀ Σ (b − β̂), Σ = [[1, r], [r, 1]]; vincolo g(b) = a‖b‖₁ + (1 − a)‖b‖₂² ≤ s, s = a t + (1 − a) t²

  }

  function interpretation() {
    interpBox.innerHTML = '<p>L’errore di <strong>training</strong> diminuisce sempre con il grado: i modelli sono annidati e ogni grado in più può solo adattarsi meglio ai dati già visti. L’errore di <strong>generalizzazione</strong> Err(d) ha invece la forma a U: scende finché il polinomio cattura la forma di f, poi sale perché la varianza della stima prevale (overfitting).</p>' +
      '<p>La <strong>validazione incrociata</strong> stima la curva a U usando solo il training: ogni osservazione è prevista da un modello che non l’ha vista. Il grado scelto varia molto tra le repliche, ma l’errore del modello scelto resta vicino al migliore possibile. Il <strong>test</strong> serve a una cosa sola: stimare, una volta, l’errore del modello finale.</p>' +
      '<p class="muted">Se il test viene usato anche per scegliere, la stima diventa ottimistica: è lo stesso meccanismo per cui l’errore di training sottostima Err, in scala più piccola. Con molti modelli candidati o con un test piccolo l’ottimismo cresce.</p>';

  function codeR() {
    var Fn = FUN[S.fun];
    return ['# ───────────────────────────────────────────────────────────────', '# StatAtlas · Lab 18 — Validazione e overfitting',
      '# R0: stessi dati, stessa suddivisione training/test e stessi fold di StatAtlas (R ≥ 3.6, stesso seed).',
      '# R1: stesse metriche (errore di training, CV, test, Err su 200 punti); poly() e i polinomi',
      '#     di Legendre generano lo stesso spazio, quindi le stesse previsioni a meno dell’arrotondamento.',
      '# ───────────────────────────────────────────────────────────────', 'library(tidyverse)', '',
      'set.seed(' + S.seed + ')', 'f <- function(x) ' + Fn.r,
      'n <- ' + S.n + '; n_test <- ' + S.nTest + '; K <- ' + S.K + '; sigma <- ' + S.sigma + '; D <- ' + S.D + '; B <- ' + S.B,
      'griglia <- tibble(x = (seq_len(' + NG + ') - 0.5) / ' + NG + ')', '',
      'adatta <- function(d, dati) if (d == 0) lm(y ~ 1, data = dati) else lm(y ~ poly(x, d), data = dati)',
      'errore <- function(fit, dati) mean((dati$y - predict(fit, newdata = dati))^2)', '',
      'una_replica <- function() {', '  x <- runif(n); y <- f(x) + sigma * rnorm(n)', '  dati <- tibble(x, y)',
      '  id_test <- sample(n, n_test)                       # il test si mette da parte subito', '  train <- dati[-id_test, ]; test <- dati[id_test, ]',
      '  fold <- sample(rep_len(1:K, nrow(train)))           # fold generati una volta, per tutti i gradi',
      '  curve <- map_dfr(0:D, \\(d) {', '    fuori <- numeric(nrow(train))',
      '    for (k in 1:K) fuori[fold == k] <- predict(adatta(d, train[fold != k, ]), newdata = train[fold == k, ])',
      '    fit <- adatta(d, train)', '    tibble(d = d, training = errore(fit, train), cv = mean((train$y - fuori)^2), test = errore(fit, test),',
      '           err = sigma^2 + mean((f(griglia$x) - predict(fit, newdata = griglia))^2))', '  })',
      '  d_cv <- curve$d[which.min(curve$cv)]; d_test <- curve$d[which.min(curve$test)]',
      '  list(curve = curve, sintesi = tibble(d_cv, d_test,', '    corretto = curve$test[d_cv + 1] - curve$err[d_cv + 1],      # scelta con CV, test usato una volta',
      '    scorretto = curve$test[d_test + 1] - curve$err[d_test + 1], # scelta e stima sul test', '    training = curve$training[d_cv + 1] - curve$err[d_cv + 1]))', '}', '',
      'repliche <- map(seq_len(B), \\(b) una_replica())', 'sintesi <- map_dfr(repliche, "sintesi")',
      'sintesi |> summarise(across(c(corretto, scorretto, training), list(media = mean, es = \\(v) sd(v) / sqrt(B))))', 'count(sintesi, d_cv)', '',
      'theme_statatlas <- function(base_size = 12) {', '  theme_minimal(base_size = base_size, base_family = "serif") +', '    theme(panel.grid.minor = element_blank(), plot.background = element_rect(fill = "#FAF8F3", colour = NA))', '}',
      '# Curve medie sulle repliche', 'map_dfr(repliche, "curve") |> group_by(d) |> summarise(across(everything(), mean)) |>',
      '  pivot_longer(-d, names_to = "errore", values_to = "valore") |>', '  ggplot(aes(d, valore, colour = errore)) + geom_line(linewidth = 1) + geom_point() +',
      '  geom_hline(yintercept = sigma^2, linetype = "dotted") + coord_cartesian(ylim = c(0, NA)) +', '  labs(x = "grado del polinomio", y = "errore quadratico medio") + theme_statatlas()', '',
      '# Replica numero ' + Math.max(1, S.k) + ' (quella mostrata)', 'repliche[[' + Math.max(1, S.k) + ']]$curve', ''].join('\n');
  }

    base: function () {

/* StatAtlas · Lab 19 — k vicini più prossimi e classificazione.
 * Due classi equiprobabili (n/2 ciascuna) in R²: scenario lineare (normali con medie ±δ/2 sull'asse x₁) o XOR
 * (miscela di quattro normali): regola ed errore di Bayes noti in forma chiusa. Vicini con SA.ml.nearest

/* StatAtlas · Lab 20 — Alberi, bagging e random forest.
 * x ~ U(−2, 2)^p (2 variabili informative + q di rumore); y = 1{g(x) > 0} scambiata con probabilità ε:

    for (i = 0; i < n; i++) y.push(((SC[S.sc].g(X[i]) > 0) !== (g.unif() < S.eps)) ? 1 : 0);

      var r = 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) + 'h' + (cw + 0.3).toFixed(1) + 'v' + (cw + 0.3).toFixed(1) + 'h' + (-cw - 0.3).toFixed(1) + 'z';

  function interpretation() {
    interpBox.innerHTML = '<p>Un albero profondo ha <strong>distorsione bassa e varianza alta</strong>: piccole variazioni dei dati cambiano la prima divisione e quindi tutto ciò che sta sotto. Confronta l’albero fisso, stimato su tutti i dati, con il primo fotogramma (un solo albero, stimato su un campione bootstrap): rettangoli e soglie cambiano molto, anche se i dati sono quasi gli stessi. Nei fotogrammi successivi i voti di molti alberi smussano la frontiera.</p>' +
      '<p>Il <strong>bagging</strong> media molti alberi bootstrap: la varianza della media di B previsioni con correlazione ρ è ρσ² + (1 − ρ)σ²/B, quindi aggiungere alberi non fa mai danno ma il guadagno si ferma a ρσ². La <strong>foresta casuale</strong> abbassa ρ scegliendo a caso mtry variabili candidate a ogni nodo: gli alberi si somigliano meno (accordo più basso), e la media funziona meglio.</p>' +
      '<p class="muted">L’errore <strong>out-of-bag</strong> usa, per ogni osservazione, solo gli alberi che non l’hanno vista (circa il 37%): è una stima dell’errore di previsione gratuita e simile a quella sul test, senza bisogno di separare dati.</p>';
  }
  function codeR() {
    return ['# ───────────────────────────────────────────────────────────────', '# StatAtlas · Lab 20 — Alberi, bagging e random forest',
      '# R0: stessi dati e stessi campioni bootstrap di StatAtlas (stesso seed, R ≥ 3.6).',
      '# R2: stesso CART didattico (Gini, soglie nei punti medi, prima variabile e soglia più piccola a parità),',
      '#     stessa estrazione di mtry variabili a ogni nodo: stessi alberi e stessi errori.',
      '# R3: rpart e ranger usano regole diverse (potatura, tie, campionamento): confronto di metodo, non stessi numeri.',
      '# ───────────────────────────────────────────────────────────────', 'library(tidyverse)', '',
      'set.seed(' + S.seed + ')', 'n <- ' + S.n + '; n_test <- ' + NT + '; p <- ' + S.p + '; eps <- ' + S.eps + '; mtry <- ' + S.mtry + '; B <- ' + S.B,
      'prof_max <- ' + S.maxDepth + '; min_foglia <- ' + S.minLeaf, 'confine <- function(X) ' + SC[S.sc].r, '',
      'genera <- function(n) {', '  X <- matrix(runif(n * p, -2, 2), ncol = p, byrow = TRUE)', '  y <- as.integer((confine(X) > 0) != (runif(n) < eps))   # etichette scambiate con probabilità eps', '  list(X = X, y = y)', '}',
      'tr <- genera(n); te <- genera(n_test)', '',
      '# CART per due classi: criterio G = n * Gini pesato dei figli, da minimizzare', 'cresci <- function(X, y, idx, mtry, prof = 0) {',
      '  yy <- y[idx]; m <- length(idx); c1 <- sum(yy); c0 <- m - c1', '  foglia <- list(foglia = TRUE, classe = as.integer(c1 > c0), n = m)',
      '  if (prof >= prof_max || m < 2 * min_foglia || c0 == 0 || c1 == 0) return(foglia)',
      '  vars <- if (mtry < p) sample(p, mtry) else seq_len(p)', '  G0 <- m - (c0^2 + c1^2) / m; best <- G0 - 1e-10; bj <- 0',
      '  for (j in vars) {', '    o <- order(X[idx, j]); v <- X[idx, j][o]; l1 <- cumsum(yy[o])[-m]',
      '    nl <- seq_len(m - 1); nr <- m - nl; l0 <- nl - l1; r1 <- c1 - l1; r0 <- nr - r1',
      '    G <- nl - (l0^2 + l1^2) / nl + nr - (r0^2 + r1^2) / nr', '    ok <- which(v[-m] < v[-1] & nl >= min_foglia & nr >= min_foglia)',
      '    if (length(ok)) { i <- ok[which.min(G[ok])]; if (G[i] < best) { best <- G[i]; bj <- j; soglia <- (v[i] + v[i + 1]) / 2 } }', '  }',
      '  if (bj == 0) return(foglia)', '  sx <- X[idx, bj] < soglia',
      '  list(foglia = FALSE, j = bj, soglia = soglia, sx = cresci(X, y, idx[sx], mtry, prof + 1), dx = cresci(X, y, idx[!sx], mtry, prof + 1))', '}',
      'prevedi <- function(t, X) {', '  if (t$foglia) return(rep(t$classe, nrow(X)))', '  out <- integer(nrow(X)); sx <- X[, t$j] < t$soglia',
      '  out[sx] <- prevedi(t$sx, X[sx, , drop = FALSE]); out[!sx] <- prevedi(t$dx, X[!sx, , drop = FALSE]); out', '}', '',
      'albero <- cresci(tr$X, tr$y, seq_len(n), mtry = p)', 'errore_albero <- mean(prevedi(albero, te$X) != te$y)', '',
      'metodi <- c(bagging = p, foresta = mtry)', 'voti_te <- matrix(0, n_test, 2); voti_oob <- matrix(0, n, 2); conta_oob <- matrix(0, n, 2)',
      'radice <- matrix(NA, B, 2, dimnames = list(NULL, names(metodi))); traiettoria <- vector("list", B)',
      'for (b in seq_len(B)) {', '  for (k in 1:2) {', '    idx <- sample(n, n, replace = TRUE)                  # campione bootstrap',
      '    t <- cresci(tr$X, tr$y, idx, mtry = metodi[k])', '    if (!t$foglia) radice[b, k] <- t$j',
      '    voti_te[, k] <- voti_te[, k] + prevedi(t, te$X)', '    fuori <- setdiff(seq_len(n), idx)                    # out-of-bag: mai visti da questo albero',
      '    voti_oob[fuori, k] <- voti_oob[fuori, k] + prevedi(t, tr$X[fuori, , drop = FALSE]); conta_oob[fuori, k] <- conta_oob[fuori, k] + 1', '  }',
      '  usati <- conta_oob > 0', '  traiettoria[[b]] <- tibble(alberi = b, metodo = names(metodi),',
      '    test = colMeans((2 * voti_te > b) != te$y),', '    oob = sapply(1:2, \\(k) mean((2 * voti_oob[usati[, k], k] > conta_oob[usati[, k], k]) != tr$y[usati[, k]])))', '}',
      'traiettoria <- bind_rows(traiettoria)', 'traiettoria |> filter(alberi == B)', 'apply(radice, 2, \\(r) table(factor(r, levels = seq_len(p))) / B)', '',
      'theme_statatlas <- function(base_size = 12) {', '  theme_minimal(base_size = base_size, base_family = "serif") +', '    theme(panel.grid.minor = element_blank(), plot.background = element_rect(fill = "#FAF8F3", colour = NA))', '}',
      'traiettoria |> pivot_longer(c(test, oob), names_to = "stima", values_to = "errore") |>', '  ggplot(aes(alberi, errore, colour = metodo, linetype = stima)) + geom_line() +',
      '  geom_hline(yintercept = c(eps, errore_albero), linetype = c("dashed", "dotted")) + theme_statatlas()', '',
      '# Confronto di metodo (R3)', '# library(ranger); ranger(y ~ ., data = data.frame(y = factor(tr$y), tr$X), num.trees = B, mtry = mtry)', ''].join('\n');
  }
  var THEORY = {
    base: function () {
      return el('div.prose', { html: '<h3>Alberi di classificazione</h3><p>Un albero divide lo spazio in rettangoli con domande del tipo x<sub>j</sub> &lt; s. A ogni nodo si sceglie la coppia (j, s) che riduce di più l’impurità di Gini, G(p) = 2p(1 − p), pesata per la numerosità dei figli; nelle foglie si prevede la classe più frequente.</p>' +
        '<h3>Bagging</h3><p>Si stimano B alberi su campioni bootstrap (n estrazioni con reinserimento) e si fa votare la maggioranza. Ogni campione lascia fuori in media (1 − 1/n)ⁿ ≈ 37% delle osservazioni: sono le osservazioni <em>out-of-bag</em>.</p>' +
        '<h3>Foresta casuale</h3><p>Come il bagging, ma a ogni nodo le variabili candidate sono solo mtry estratte a caso (di solito √p). Gli alberi diventano meno simili tra loro.</p>' +
        '<div class="callout warn">L’errore OOB va calcolato per ogni osservazione solo con gli alberi che non l’hanno vista; mescolare alberi che l’hanno usata lo rende ottimista come l’errore di training.</div>' });
    },
    adv: function () {
      return el('div.prose', { html: '<h3>Perché la media aiuta</h3><p>Se B previsioni hanno varianza σ² e correlazione a coppie ρ, la loro media ha varianza ρσ² + (1 − ρ)σ²/B (Breiman, 2001). Il secondo termine sparisce con B; il primo si riduce solo diminuendo ρ: è il ruolo di mtry.</p>' +
        '<h3>Limiti</h3><p>La media non corregge la distorsione: con frontiere oblique (scenario diagonale) gli alberi costruiscono scalinate, e anche la foresta le approssima a gradini. Con molte variabili di rumore e mtry piccolo, molti nodi non trovano variabili utili e la foresta peggiora.</p>' +
        '<h3>Importanza delle variabili</h3><p>Sommando le riduzioni di Gini per variabile su tutti gli alberi, o permutando una variabile nei dati OOB e misurando quanto cresce l’errore, si ottengono misure d’importanza; la prima favorisce le variabili con molte soglie possibili.</p>' });
    }
  };

/* StatAtlas · Lab 24 — Reti neurali artificiali e backpropagation.
 * Dati: U = runif(2n) e Z = rnorm(2n) letti per righe; etichetta calcolata dai punti puliti, poi x + σz.
 * Suddivisione training/validazione con sample(n, n_val). Rete 2 → H → 1 (SA.nn), inizializzata con un seed proprio,
 * discesa del gradiente a lotto intero: un passo del laboratorio = un'epoca. Nessun numero casuale durante l'addestramento. */
(function () {
  var el, S, NG = 50, SEEDS = 20;
  var DATA = { xor: 'XOR (quadranti)', line: 'Separabile da una retta', moons: 'Due lune' };

    var g = new SA.RRNG(s.seed), n = s.n, U = [], Z = [], X = [], y = [], i;

    for (i = 0; i < n; i++) {

      if (s.data === 'moons') { var two = i >= n / 2, t = Math.PI * U[i][0]; x = two ? [1 - Math.cos(t) - 0.5, 0.5 - Math.sin(t) - 0.25] : [Math.cos(t) - 0.5, Math.sin(t) - 0.25]; lab = two ? 1 : 0; }

      X.push([x[0] + s.sigma * Z[i][0], x[1] + s.sigma * Z[i][1]]); y.push(lab);
    }

    var pick = function (ids) { return { X: ids.map(function (k) { return X[k - 1]; }), y: ids.map(function (k) { return y[k - 1]; }) }; };
    return { tr: pick(sp.train), va: pick(sp.test) };
  }
  function newState(prev) {
    var s = { data: 'xor', n: 200, sigma: 0.1, pv: 0.3, H: 4, act: 'tanh', eta: 0.5, lambda: 0, E: 2000, seed: 2026, iseed: 1, pred: null, sel: 0 };
    if (prev) for (var k in s) if (prev[k] !== undefined) s[k] = prev[k];
    var D = gen(s); s.tr = D.tr; s.va = D.va;
    s.net = SA.nn.init(new SA.RRNG(s.iseed), s.H, s.act); s.net0 = SA.nn.clone(s.net);
    s.e = 0; s.hist = { tr: [], va: [], atr: [], ava: [] }; s.diverged = false; s.multi = null;

  }

  var multiTask = null;

  }

  /* ---------- grafici ---------- */
  var figA, figB, figC, figD, legA, legC, FA, multiBtn;

  function interpretation() {
    interpBox.innerHTML = '<p>Ogni neurone nascosto calcola una combinazione lineare degli ingressi e la trasforma con una funzione non lineare; l’uscita combina i neuroni e passa per la sigmoide, come una regressione logistica sulle variabili create dalla rete. Con abbastanza neuroni si può approssimare qualunque frontiera regolare.</p>' +
      '<p>L’addestramento minimizza l’entropia incrociata con la <strong>discesa del gradiente</strong>; la <strong>backpropagation</strong> calcola il gradiente propagando all’indietro l’errore p − y attraverso i pesi (i δ nello schema). Il controllo con le differenze finite verifica che il gradiente sia giusto.</p>' +
      '<p class="muted">Con un learning rate troppo alto la perdita oscilla o esplode; con molti neuroni, poco rumore e nessuna penalità la perdita di training continua a scendere mentre quella di validazione risale: è il sovradattamento, che si contrasta con la penalità L2 o fermandosi al minimo della validazione. Con η vicino al limite di stabilità (qui già η = 1 su XOR) la traiettoria diventa sensibile agli arrotondamenti: differenze nell’ultima cifra crescono epoca dopo epoca, e anche R e il browser possono separarsi nelle cifre finali.</p>';
  }
  function codeR() {
    var d = S.data;
    return ['# ───────────────────────────────────────────────────────────────', '# StatAtlas · Lab 24 — Rete neurale 2 → H → 1 e backpropagation',
      '# R0: stessi dati, stessa suddivisione e stessi pesi iniziali di StatAtlas (R ≥ 3.6).',
      '# R2: stessa discesa del gradiente a lotto intero: stesse perdite a meno dell’arrotondamento.',
      '# R3: nnet o torch usano ottimizzatori e inizializzazioni diversi: confronto di metodo, non stessi pesi.',
      '# ───────────────────────────────────────────────────────────────', 'library(tidyverse)', '',
      'n <- ' + S.n + '; sigma <- ' + S.sigma + '; n_val <- ' + Math.round(S.pv * S.n) + '; H <- ' + S.H + '; eta <- ' + S.eta + '; lambda <- ' + S.lambda + '; E <- ' + S.E,
      'set.seed(' + S.seed + ')', 'U <- matrix(runif(2 * n), ncol = 2, byrow = TRUE); Z <- matrix(rnorm(2 * n), ncol = 2, byrow = TRUE)',
      d === 'moons' ? 'due <- seq_len(n) > n / 2; t <- pi * U[, 1]\nX0 <- cbind(ifelse(due, 1 - cos(t) - 0.5, cos(t) - 0.5), ifelse(due, 0.5 - sin(t) - 0.25, sin(t) - 0.25)); y <- as.numeric(due)'
        : 'X0 <- 2 * U - 1; y <- as.numeric(' + (d === 'xor' ? 'X0[, 1] * X0[, 2] > 0' : 'X0[, 2] > 0.5 * X0[, 1]') + ')',
      'X <- X0 + sigma * Z                                   # etichetta dai punti puliti, poi rumore', 'id_val <- sample(n, n_val)',
      'Xtr <- X[-id_val, ]; ytr <- y[-id_val]; Xva <- X[id_val, ]; yva <- y[id_val]', '',
      '# Inizializzazione con un seed proprio', 'inizializza <- function(seme) {', '  set.seed(seme); a <- sqrt(6 / (2 + H)); c <- sqrt(6 / (H + 1))',
      '  list(W1 = matrix(runif(2 * H, -a, a), nrow = H, byrow = TRUE), b1 = rep(0, H), W2 = runif(H, -c, c), b2 = 0)', '}',
      S.act === 'tanh' ? 'att <- tanh; datt <- function(A, Hh) 1 - Hh^2' : 'att <- function(A) pmax(A, 0); datt <- function(A, Hh) (A > 0) * 1',
      'avanti <- function(par, X) { A <- sweep(X %*% t(par$W1), 2, par$b1, "+"); Hh <- att(A); list(A = A, H = Hh, z = drop(Hh %*% par$W2) + par$b2) }',
      'bce <- function(z, y) mean(pmax(z, 0) - y * z + log1p(exp(-abs(z))))   # forma stabile',
      'gradiente <- function(par, X, y) {', '  f <- avanti(par, X); dz <- (plogis(f$z) - y) / nrow(X)', '  dA <- outer(dz, par$W2) * datt(f$A, f$H)',
      '  list(W1 = t(dA) %*% X + lambda * par$W1, b1 = colSums(dA), W2 = drop(t(f$H) %*% dz) + lambda * par$W2, b2 = sum(dz))', '}',
      'addestra <- function(par) {', '  storia <- matrix(NA, E + 1, 2, dimnames = list(NULL, c("training", "validazione")))',
      '  storia[1, ] <- c(bce(avanti(par, Xtr)$z, ytr), bce(avanti(par, Xva)$z, yva))',
      '  for (e in seq_len(E)) {', '    g <- gradiente(par, Xtr, ytr); par <- Map(\\(p, d) p - eta * d, par, g)',
      '    storia[e + 1, ] <- c(bce(avanti(par, Xtr)$z, ytr), bce(avanti(par, Xva)$z, yva))', '  }', '  list(par = par, storia = storia)', '}', '',
      '# Controllo del gradiente con differenze finite (all’inizio)', 'par0 <- inizializza(' + S.iseed + ')', 'obiettivo <- function(v) { p <- relist(v, par0); bce(avanti(p, Xtr)$z, ytr) + lambda / 2 * (sum(p$W1^2) + sum(p$W2^2)) }',
      'v0 <- unlist(as.relistable(par0)); num <- sapply(seq_along(v0), \\(k) { h <- replace(numeric(length(v0)), k, 1e-5); (obiettivo(v0 + h) - obiettivo(v0 - h)) / 2e-5 })',
      'max(abs(num - unlist(gradiente(par0, Xtr, ytr)))) / max(abs(num))', '',
      'fit <- addestra(par0)', 'tail(fit$storia, 1)', 'mean((plogis(avanti(fit$par, Xva)$z) > 0.5) == yva)   # accuratezza di validazione', '',
      '# ' + SEEDS + ' inizializzazioni diverse sugli stessi dati', 'esiti <- map_dfr(seq_len(' + SEEDS + '), \\(r) { f <- addestra(inizializza(' + S.iseed + ' + r)); tibble(seed = ' + S.iseed + ' + r, training = f$storia[E + 1, 1], validazione = f$storia[E + 1, 2]) })', 'esiti', '',
      'theme_statatlas <- function(base_size = 12) {', '  theme_minimal(base_size = base_size, base_family = "serif") +', '    theme(panel.grid.minor = element_blank(), plot.background = element_rect(fill = "#FAF8F3", colour = NA))', '}',
      'as_tibble(fit$storia) |> mutate(epoca = 0:E) |> pivot_longer(-epoca, names_to = "insieme", values_to = "perdita") |>', '  ggplot(aes(epoca, perdita, colour = insieme)) + geom_line() + theme_statatlas()', ''].join('\n');
  }
  var THEORY = {
    base: function () {
      return el('div.prose', { html: '<h3>Il modello</h3><div class="eq">h = φ(W₁x + b₁) &nbsp;·&nbsp; p = σ(w₂ᵀh + b₂)</div><p>φ = tanh o ReLU, σ = sigmoide. La perdita è l’entropia incrociata media −[y log p + (1 − y) log(1 − p)], calcolata in forma stabile a partire da z = w₂ᵀh + b₂, più (λ/2)‖W‖².</p>' +
        '<h3>Backpropagation</h3><p>Per un’osservazione: δ<sub>out</sub> = p − y; ∂ℓ/∂w₂ = δ<sub>out</sub> h; δ<sub>h</sub> = δ<sub>out</sub> w₂ ⊙ φ′(a); ∂ℓ/∂W₁ = δ<sub>h</sub> xᵀ. È la regola della catena applicata strato per strato, dall’uscita verso l’ingresso.</p>' +
        '<h3>Discesa del gradiente</h3><p>θ ← θ − η ∇L(θ), con il gradiente medio su tutto il training (lotto intero). Il learning rate η decide la lunghezza del passo: troppo piccolo è lento, troppo grande oscilla o diverge.</p>' +
        '<div class="callout warn">Una buona accuratezza di training non dice nulla sulla generalizzazione: si guarda la validazione, e il test si tiene da parte (lab 18).</div>' });
    },
    adv: function () {
      return el('div.prose', { html: '<h3>Non convessità e simmetrie</h3><p>Permutare i neuroni nascosti lascia la funzione invariata, e con tanh anche cambiare il segno di tutti i pesi di un neurone: la perdita ha molte copie di ogni minimo, e tra queste molti punti di sella e regioni piatte.</p>' +
        '<h3>Approssimazione universale</h3><p>Con un solo strato nascosto e abbastanza neuroni una rete approssima qualunque funzione continua su un compatto (Cybenko, 1989; Hornik, 1991): il problema pratico non è l’espressività ma la stima con dati finiti.</p>' +
        '<h3>Regolarizzazione</h3><p>La penalità L2 (weight decay) restringe i pesi verso zero come la ridge del lab 15; l’arresto anticipato al minimo della validazione ha un effetto simile. Varianti dell’ottimizzatore (mini-batch, momento, Adam) cambiano il percorso e spesso la soluzione raggiunta.</p>' });
    }

        el('div.fig', el('div.fig-title', el('h3', 'Perdita durante l’addestramento'), legC), figC),

          SA.ui.button('Figura PNG', { icon: 'download', cls: 'btn-ghost', onclick: function () { SA.ui.exportPNG([figA.querySelector('svg'), figC.querySelector('svg')], 'statatlas_lab24.png', ['Rete neurale', DATA[S.data] + ' · H = ' + S.H + ' · ' + S.act + ' · η = ' + S.eta + ' · seed ' + S.seed + '/' + S.iseed]); } })))));
      var s4 = SA.ui.step('4', 'Teoria e simulazione a confronto'); tblBody = el('tbody'); kpiBox = el('div.kpis');
      s4.body.append(el('div.tbl-wrap', el('table.tv', el('thead', el('tr', el('th', 'Quantità'), el('th', 'Riferimento'), el('th', 'Risultato'), el('th', 'Natura'))), tblBody)),
        el('div.status-key', el('span', SA.ui.badge('exact'), ' verifica esatta'), el('span', SA.ui.badge('mc'), ' su più inizializzazioni'), el('span', SA.ui.badge('none'), ' valore corrente')), kpiBox);

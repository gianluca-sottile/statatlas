<style>
/* styles/tokens.css */
/* StatAtlas · design tokens — tema "Editoriale" */
:root {
  --paper: #FAF8F3;
  --paper-2: #F2EEE5;
  --card: #FFFDF9;
  --ink: #1C1B19;
  --ink-2: #48453F;
  --ink-3: #6B665D;  /* ≥ 4,9:1 su tutte le superfici chiare */
  --rule: #E2DCD0;
  --rule-2: #CFC7B8;
  --accent: #9A3412;
  --accent-soft: #F6E7DD;
  --focus: #1D4ED8;

  /* dati: Okabe–Ito, sempre accompagnati da forma/tratteggio */
  /* tinte Okabe–Ito scurite per contrasto ≥ 4,5:1 anche come testo (WCAG AA) */
  --c1: #006C9E;  /* serie 1    ▲ continuo  */
  --c2: #B34A00;  /* serie 2    ◆ tratteggio */
  --c3: #007A5A;  /* serie 3    ● punteggiato */
  --c4: #CC79A7;
  --c-theory: #1C1B19;

  /* etichette di stato del risultato */
  --st-exact: #1F6F43;     --st-exact-bg: #E3F1E8;
  --st-asym: #1E4E8C;      --st-asym-bg: #E2EBF6;
  --st-approx: #8A5A00;    --st-approx-bg: #F6ECD6;
  --st-mc: #6B3E8A;        --st-mc-bg: #EEE4F4;

  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --fs-0: .8rem; --fs-1: .9rem; --fs-2: 1rem; --fs-3: 1.25rem; --fs-4: 1.56rem; --fs-5: 1.95rem; --fs-6: 2.6rem;
  --r: 10px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(40, 30, 10, .05), 0 6px 24px -12px rgba(40, 30, 10, .18);
  --sidebar: 280px; --measure: 72ch;
  --art-bg: #F6F2EA; --logo-bg: #FFFDF9;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151412; --paper-2: #1C1B18; --card: #201E1B;
    --ink: #ECE7DC; --ink-2: #C3BCAE; --ink-3: #8F887B;
    --rule: #33302B; --rule-2: #46423B;
    --accent: #F0A07A; --accent-soft: #3A2419; --focus: #93B4FF;
    --c1: #56B4E9; --c2: #F08A3C; --c3: #2FC499; --c4: #E19BC4; --c-theory: #ECE7DC;
    --st-exact: #8FD6AA; --st-exact-bg: #1B2E22; --st-asym: #A8C6F0; --st-asym-bg: #1A2638;
    --st-approx: #E8C37A; --st-approx-bg: #33291A; --st-mc: #D0AEE8; --st-mc-bg: #2B2134;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.6);
    --art-bg: #1A1916; --logo-bg: #201E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151412; --paper-2: #1C1B18; --card: #201E1B;
  --ink: #ECE7DC; --ink-2: #C3BCAE; --ink-3: #8F887B;
  --rule: #33302B; --rule-2: #46423B;
  --accent: #F0A07A; --accent-soft: #3A2419; --focus: #93B4FF;
  --c1: #56B4E9; --c2: #F08A3C; --c3: #2FC499; --c4: #E19BC4; --c-theory: #ECE7DC;
  --st-exact: #8FD6AA; --st-exact-bg: #1B2E22; --st-asym: #A8C6F0; --st-asym-bg: #1A2638;
  --st-approx: #E8C37A; --st-approx-bg: #33291A; --st-mc: #D0AEE8; --st-mc-bg: #2B2134;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.6);
  --art-bg: #1A1916; --logo-bg: #201E1B;
  color-scheme: dark;
}

/* styles/app.css */
/* StatAtlas · base, layout e componenti */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 var(--fs-2)/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: var(--fs-6); }
h2 { font-size: var(--fs-4); }
h3 { font-size: var(--fs-3); }
p { margin: 0 0 1em; }
a { color: var(--accent); }
code, pre, kbd { font-family: var(--mono); font-size: .88em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.m { font-family: var(--serif); font-style: italic; white-space: nowrap; }
.m-up { font-family: var(--serif); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--rule); padding: 28px 20px 24px; background: var(--paper);
}
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); margin-bottom: 4px; }
.brand-mark { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
.brand-mark span { color: var(--accent); }
.brand-tag { color: var(--ink-3); font-size: var(--fs-0); margin: 0 0 22px; }
.nav-part { margin: 18px 0 6px; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-link {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: baseline; gap: 4px;
  padding: 6px 8px; border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none; font-size: var(--fs-1);
}
.nav-link .num { font-family: var(--serif); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-link:hover { background: var(--paper-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav-link[aria-current="page"] .num { color: var(--accent); }
.nav-link.is-soon { color: var(--ink-3); }
.nav-link .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-2); align-self: center; }
.nav-link.is-ready .dot { background: var(--st-exact); }
.sidebar-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; gap: 8px; flex-wrap: wrap; }

.topbar { display: none; }
main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding: 48px 48px 96px; }

/* ---------- bottoni e controlli ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  font: 500 var(--fs-1)/1 var(--sans); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule-2); border-radius: var(--r-sm); padding: 8px 12px; cursor: pointer;
  min-height: 36px; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--paper-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--paper-2); }
.btn-icon { padding: 8px; min-width: 36px; }
.btn svg { width: 16px; height: 16px; }

.field { display: grid; gap: 4px; }
.field > span { font-size: var(--fs-0); color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.field output { font-family: var(--serif); font-variant-numeric: tabular-nums; color: var(--ink); font-size: var(--fs-1); }
.field-row { display: flex; justify-content: space-between; align-items: baseline; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="number"], select {
  font: inherit; font-size: var(--fs-1); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule-2); border-radius: var(--r-sm); padding: 6px 8px; min-height: 36px; width: 100%;
}
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: var(--r-sm); overflow: hidden; background: var(--card); }
.seg button { font: 500 var(--fs-1) var(--sans); border: 0; background: transparent; color: var(--ink-2); padding: 8px 14px; cursor: pointer; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- home ---------- */
.hero { padding: 24px 0 40px; border-bottom: 1px solid var(--rule); margin-bottom: 40px; }
.kicker { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
.lede { font-family: var(--serif); font-size: var(--fs-3); color: var(--ink-2); max-width: 60ch; line-height: 1.5; }
.parts { display: grid; gap: 40px; }
.part h2 { display: flex; gap: 12px; align-items: baseline; }
.part h2 .roman { font-size: var(--fs-3); color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card {
  display: block; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 18px 18px 16px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s;
}
a.card:hover { border-color: var(--rule-2); box-shadow: var(--shadow); transform: translateY(-1px); }
.card .num { font-family: var(--serif); color: var(--ink-3); font-size: var(--fs-1); }
.card h3 { font-size: 1.12rem; margin: 4px 0 6px; }
.card p { font-size: var(--fs-1); color: var(--ink-2); margin: 0 0 10px; }
.card.is-soon { background: transparent; border-style: dashed; }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--paper-2); color: var(--ink-3); }
.tag-ready { background: var(--st-exact-bg); color: var(--st-exact); }
.tag-new { background: var(--accent-soft); color: var(--accent); }

/* ---------- laboratorio ---------- */
.lab-head { padding-bottom: 28px; border-bottom: 1px solid var(--rule); margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
.lab-head h1 { font-size: var(--fs-5); max-width: 22ch; }
.lab-head .lede { font-size: 1.12rem; margin: 0; }
.step { display: grid; grid-template-columns: 56px 1fr; gap: 0 16px; padding: 32px 0; border-bottom: 1px solid var(--rule); }
.step:last-child { border-bottom: 0; }
.step-num { font-family: var(--serif); font-size: var(--fs-4); color: var(--accent); line-height: 1; padding-top: 2px; }
.step-label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin-bottom: 6px; }
.step h2 { font-size: var(--fs-3); }
.step-body { min-width: 0; }
.question { font-family: var(--serif); font-size: var(--fs-4); line-height: 1.35; max-width: 34ch; margin: 0; }
.prose { max-width: var(--measure); color: var(--ink-2); }
.prose strong { color: var(--ink); }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; max-width: 760px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; }
.choice label {
  display: block; padding: 12px 14px; border: 1px solid var(--rule-2); border-radius: var(--r-sm); background: var(--card);
  cursor: pointer; font-size: var(--fs-1); transition: border-color .15s, background .15s;
}
.choice input:checked + label { border-color: var(--ink); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--ink); }
.choice input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.feedback { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; max-width: 760px; font-size: var(--fs-1); }
.muted { color: var(--ink-3); font-size: var(--fs-1); }

/* esperimento */
.lab-grid { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.controls { display: grid; gap: 16px; position: sticky; top: 16px; }
.controls .seg { display: flex; width: 100%; }
.controls .seg button { flex: 1; padding: 8px 6px; }
.controls > .field:first-child { grid-column: 1 / -1; }
.lab-head > .btn { justify-self: start; }
.transport { display: flex; gap: 6px; flex-wrap: wrap; }
.progress { height: 4px; background: var(--paper-2); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .1s linear; }
.figure { display: grid; gap: 16px; }
.fig { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 14px 8px; }
.fig-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.fig-title h3 { font-size: 1.02rem; margin: 0; }
.fig svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--fs-0); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 26px; height: 12px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* tabella teoria vs simulazione */
.tbl-wrap { overflow-x: auto; }
table.tv { border-collapse: collapse; width: 100%; font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
table.tv th, table.tv td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.tv th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
table.tv th:first-child, table.tv td:first-child { text-align: left; }
table.tv td .th { color: var(--ink-3); font-size: .85em; display: block; }
table.tv .est { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.badge { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.st-exact { background: var(--st-exact-bg); color: var(--st-exact); }
.st-asym { background: var(--st-asym-bg); color: var(--st-asym); }
.st-approx { background: var(--st-approx-bg); color: var(--st-approx); }
.st-mc { background: var(--st-mc-bg); color: var(--st-mc); }
.status-key { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: var(--fs-0); color: var(--ink-3); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
.kpi { border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; background: var(--card); }
.kpi b { display: block; font-family: var(--serif); font-size: var(--fs-4); font-weight: 600; line-height: 1.1; }
.kpi span { font-size: var(--fs-0); color: var(--ink-3); }

/* codice R */
.code { position: relative; background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--rule); font-size: var(--fs-0); color: var(--ink-3); }
.code pre { margin: 0; padding: 16px; overflow: auto; max-height: 520px; line-height: 1.55; font-size: .82rem; tab-size: 2; }
.tok-c { color: var(--ink-3); font-style: italic; }
.tok-s { color: var(--st-exact); }
.tok-n { color: var(--c2); }
.tok-k { color: var(--accent); font-weight: 600; }
.tok-f { color: var(--c1); }

/* drawer approfondimenti */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(20, 16, 10, .32); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: min(620px, 100vw); background: var(--paper);
  border-left: 1px solid var(--rule); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .25s ease;
  z-index: 50; display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer.open + .drawer-backdrop, .drawer-backdrop.show { opacity: 1; pointer-events: auto; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--rule); gap: 12px; }
.drawer-body { overflow-y: auto; padding: 24px 28px 48px; }
.drawer-body h3 { margin-top: 1.4em; }
.drawer-body .prose { color: var(--ink); }
.eq { font-family: var(--serif); font-size: 1.08rem; text-align: center; margin: 14px 0; padding: 12px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-sm); overflow-x: auto; }
.callout { border-left: 3px solid var(--st-asym); background: var(--st-asym-bg); padding: 10px 14px; border-radius: 0 var(--r-sm) var(--r-sm) 0; margin: 14px 0; font-size: var(--fs-1); }
.callout.warn { border-color: var(--st-approx); background: var(--st-approx-bg); }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; margin: 0 2px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--r-sm); font-size: var(--fs-1); opacity: 0; transition: .2s; z-index: 60; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.foot { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: var(--fs-0); color: var(--ink-3); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .lab-grid { grid-template-columns: 1fr; }
  .controls { position: static; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 45; width: min(300px, 86vw); transform: translateX(-100%); transition: transform .25s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 30; }
  .page { padding: 28px 16px 72px; }
  h1 { font-size: var(--fs-5); }
  .lab-head { grid-template-columns: 1fr; }
  .lab-head h1 { font-size: var(--fs-4); }
  .step { grid-template-columns: 1fr; }
  .step-num { font-size: var(--fs-3); margin-bottom: 6px; }
  .question { font-size: var(--fs-3); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .sidebar, .topbar, .controls, .toolbar, .drawer { display: none !important; } .app { display: block; } }

/* styles/editorial.css */
/* StatAtlas · styles/editorial.css — revisione grafica 1.1:
 * identità (logo, tavole illustrate), cornici editoriali, layout più ampio, grafici più grandi. */

/* ---------- impaginazione generale ---------- */
.page { max-width: 1380px; padding: 52px 56px 104px; }
h1 { letter-spacing: -.02em; }
h1 em { font-style: italic; color: var(--accent); font-weight: 600; }
::selection { background: var(--accent-soft); }
a.btn { text-decoration: none; }

/* ---------- marchio ---------- */
.brand { align-items: center; gap: 10px; }
.brand .logo { flex: none; }
.brand-mark { font-size: 1.55rem; }
.sidebar { background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%); }
.sidebar::after { content: ""; position: absolute; top: 0; right: 0; width: 3px; height: 100%; background: repeating-linear-gradient(180deg, var(--rule) 0 6px, transparent 6px 12px); }
.nav-link { position: relative; padding: 7px 10px; }
.nav-link[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent); }
.topbar .brand { display: flex; }

/* ---------- home ---------- */
.hero-home { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: 20px 0 48px; border-bottom: 0; margin-bottom: 8px; }
.hero-home h1 { font-size: clamp(2.3rem, 4.2vw, 3.6rem); max-width: 14ch; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero-art { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero-art .mosaic { border: 1px solid var(--rule-2); border-radius: 8px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
.hero-art .mosaic svg { display: block; width: 100%; height: auto; }
.hero-art .m1, .hero-art .m2 { transform: translateY(18px); }
.hero-logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -38%); z-index: 2; background: var(--paper); border-radius: 50%; padding: 10px; box-shadow: 0 0 0 1px var(--rule-2), var(--shadow); }
.hero-logo .logo { display: block; width: 104px; height: 104px; }

.how { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 26px 0 30px; margin: 30px 0 52px; position: relative; }
.how::before, .how::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; background: var(--rule); }
.how::before { top: 3px; } .how::after { bottom: 3px; }
.how-steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; counter-reset: s; }
.how-steps li { display: grid; gap: 4px; position: relative; padding-top: 4px; }
.how-steps li::after { content: ""; position: absolute; top: 19px; left: 42px; right: -8px; height: 1px; background: var(--rule-2); }
.how-steps li:last-child::after { display: none; }
.how-num { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-family: var(--serif); font-weight: 600; background: var(--paper); position: relative; z-index: 1; }
.how-steps strong { font-family: var(--serif); font-size: 1.04rem; margin-top: 6px; }
.how-steps span:last-child { font-size: var(--fs-0); color: var(--ink-3); line-height: 1.45; }

.parts { gap: 64px; }
.part-banner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 36px; align-items: center; margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--rule); }
.part-roman { font-family: var(--serif); font-size: 4.2rem; line-height: .9; color: var(--accent); font-weight: 600; }
.part-banner h2 { font-size: var(--fs-5); margin: 6px 0 8px; }
.part-banner p { color: var(--ink-2); max-width: 60ch; margin-bottom: 6px; font-size: 1.04rem; }
.part-art { border: 1px solid var(--rule-2); padding: 7px; background: var(--card); border-radius: 4px; box-shadow: var(--shadow); }
.part-art svg { display: block; width: 100%; height: auto; border: 1px solid var(--rule); }

.cards { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }
.card { padding: 0; overflow: hidden; display: flex; flex-direction: column; border-radius: 10px; }
.card-art { border-bottom: 1px solid var(--rule); aspect-ratio: 16 / 8; overflow: hidden; }
.card-art svg { display: block; width: 100%; height: 100%; transition: transform .35s ease; }
a.card:hover .card-art svg { transform: scale(1.04); }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.card .num { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; font-family: var(--sans); font-weight: 700; color: var(--accent); }
.card h3 { font-size: 1.2rem; margin: 2px 0 6px; }
.card p { flex: 1; }
.card-go { font-size: var(--fs-1); font-weight: 600; color: var(--accent); }

/* ---------- testata del laboratorio ---------- */
.lab-head { grid-template-columns: minmax(0, 1fr) minmax(260px, 380px); gap: 40px; align-items: center; padding-bottom: 32px; border-bottom: 0; position: relative; }
.lab-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule); }
.lab-head h1 { font-size: clamp(2rem, 3.4vw, 2.9rem); max-width: 20ch; }
.head-actions { margin-top: 18px; }
.lab-cover { margin: 0; border: 1px solid var(--rule-2); background: var(--card); padding: 8px 8px 0; border-radius: 4px; box-shadow: var(--shadow); }
.lab-cover svg { display: block; width: 100%; height: auto; border: 1px solid var(--rule); }
.lab-cover figcaption { font-family: var(--serif); font-style: italic; font-size: .84rem; color: var(--ink-3); text-align: center; padding: 7px 0 8px; }
.chips { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; max-width: 70ch; }
.chips li { font-size: .8rem; color: var(--ink-2); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 99px; padding: 4px 11px 4px 24px; position: relative; line-height: 1.35; }
.chips li::before { content: "✓"; position: absolute; left: 9px; color: var(--st-exact); font-weight: 700; }

/* ---------- passi ---------- */
.step { grid-template-columns: 64px 1fr; padding: 40px 0; border-bottom: 1px solid var(--rule); }
.step-num { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--accent); display: grid; place-items: center; font-size: 1.3rem; font-weight: 600; background: var(--paper); }
.step h2 { font-size: 1.55rem; }
.question { font-size: clamp(1.4rem, 2.2vw, 1.8rem); max-width: 40ch; padding-left: 18px; border-left: 3px solid var(--accent); }

/* ---------- riquadri didattici ---------- */
.focus-box { border: 1px solid var(--rule-2); border-radius: 10px; background: var(--card); padding: 16px 20px 18px; margin: 4px 0 22px; position: relative; }
.focus-box::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--rule); border-radius: 7px; pointer-events: none; }
.focus-title { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 600; font-size: 1.08rem; margin-bottom: 10px; position: relative; }
.focus-icon { color: var(--accent); font-size: 1.2rem; }
.focus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 22px; margin: 0; position: relative; }
.focus-grid dt { font-weight: 700; font-size: var(--fs-1); color: var(--ink); }
.focus-grid dd { margin: 2px 0 0; font-size: var(--fs-1); color: var(--ink-2); line-height: 1.45; }
.table-guide { font-size: var(--fs-1); color: var(--ink-2); background: var(--paper-2); border-left: 3px solid var(--st-asym); padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 14px; max-width: 110ch; }

/* ---------- esperimento: grafici più grandi ---------- */
.lab-grid { grid-template-columns: 290px minmax(0, 1fr); gap: 28px; }
.panel.controls { border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
.panel.controls::before { content: "Controlli"; display: block; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding-bottom: 10px; margin-bottom: 2px; border-bottom: 1px solid var(--rule); }
.figure { gap: 20px; }
.fig { border-radius: 12px; padding: 16px 18px 10px; position: relative; box-shadow: var(--shadow); }
.fig::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 3px; background: linear-gradient(90deg, var(--accent) 0 48px, var(--rule) 48px); border-radius: 0 0 2px 2px; }
.fig-title h3 { font-size: 1.14rem; }
.legend { font-size: .82rem; gap: 6px 18px; }
.fig svg text { font-variant-numeric: tabular-nums; }
.btn-primary { box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 4px 14px -6px rgba(154,52,18,.45); }

/* tabelle e indicatori */
table.tv { font-size: .95rem; }
table.tv thead th { border-bottom: 2px solid var(--rule-2); }
table.tv tbody tr:hover td { background: var(--paper-2); }
.kpi { border-radius: 10px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .7; }

/* ---------- drawer di approfondimento ---------- */
.drawer { width: min(760px, 100vw); }
.drawer-head { display: grid; gap: 12px; padding: 18px 26px 14px; }
.seg-tabs { width: 100%; }
.seg-tabs button { flex: 1; }
.drawer-body { padding: 26px 34px 64px; }
.drawer-body .prose { max-width: none; }
.drawer-body h3 { font-size: 1.22rem; padding-top: 6px; }
.drawer-body h3.sep { border-top: 1px solid var(--rule); padding-top: 22px; margin-top: 28px; }
.objectives { border: 1px solid var(--rule-2); background: var(--card); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
.objectives ul { margin: 6px 0 0; padding-left: 20px; }
.objectives li { margin: 3px 0; }
.errlist li { margin: 4px 0; }
.errlist li::marker { content: "✗  "; color: var(--c2); }
.exercise { display: grid; grid-template-columns: 38px 1fr; gap: 12px; border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin: 12px 0; background: var(--card); }
.ex-num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--paper); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; }
.exercise p { margin: 0 0 6px; }
.exercise details { margin-top: 6px; }
.exercise summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: var(--fs-1); }
.exercise details p { margin-top: 8px; padding: 10px 12px; background: var(--paper-2); border-radius: 6px; }
.refs { padding-left: 22px; }
.refs li { margin: 8px 0; line-height: 1.5; }

/* ---------- animazione di comparsa ---------- */
@keyframes sa-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page > * { animation: sa-in .45s ease both; }
.page > *:nth-child(2) { animation-delay: .05s; } .page > *:nth-child(3) { animation-delay: .1s; }

/* ---------- responsive ---------- */
@media (max-width: 1280px) {
  .lab-grid { grid-template-columns: 1fr; }
  .panel.controls { position: static; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

}

  .how-steps { grid-template-columns: repeat(3, 1fr); }
  .how-steps li::after { display: none; }
  .lab-cover { max-width: 460px; }
}
@media (max-width: 860px) {
  .page { padding: 28px 16px 72px; }
  .how-steps { grid-template-columns: 1fr 1fr; }
  .part-roman { font-size: 3rem; }
  .step { grid-template-columns: 1fr; }
  .step-num { width: 36px; height: 36px; font-size: 1.05rem; margin-bottom: 8px; }
  .sidebar::after { display: none; }
  .drawer-body { padding: 20px 18px 48px; }
}

    avanzato: '<h3>Famiglie di posizione e scala</h3><p>Se Z ha densità f₀, allora X = μ + σZ ha densità f₀((x − μ)/σ)/σ: Normale, Cauchy, Laplace, Logistica sono famiglie di questo tipo. Quantili e momenti si trasformano linearmente, e gli stimatori “equivarianti” rispettano la trasformazione.</p><h3>Famiglia esponenziale</h3><p>Molte leggi del catalogo (Bernoulli, Binomiale con n noto, Poisson, Geometrica, Normale, Gamma, Beta) hanno densità della forma h(x) exp{η(θ)T(x) − A(θ)}. Ne seguono le proprietà che rivedremo nei laboratori di inferenza: statistiche sufficienti di dimensione fissa, E T(X) = A′, stimatori di massima verosimiglianza che uguagliano media teorica ed empirica di T.</p><h3>Funzione generatrice e trasformazioni</h3><p>M(t) = E e<sup>tX</sup>, quando esiste in un intorno di 0, determina la legge. È lo strumento più rapido per dimostrare i legami della mappa: per esempio la somma di k esponenziali indipendenti ha M(t) = (λ/(λ − t))<sup>k</sup>, che è la funzione generatrice della Gamma(k, λ).</p>',
    esercizi: [['Per X ~ Esponenziale(λ) dimostra che P(X > s + t | X > s) = P(X > t). Che cosa significa per un tempo di attesa?', 'P(X > s + t)/P(X > s) = e<sup>−λ(s+t)</sup>/e<sup>−λs</sup> = e<sup>−λt</sup>. Assenza di memoria: aver già atteso s non cambia la legge dell’attesa residua.'], ['Se U ~ U(0, 1), qual è la legge di −log(U)/λ? Verificalo nel laboratorio 03.', 'P(−log U/λ ≤ x) = P(U ≥ e<sup>−λx</sup>) = 1 − e<sup>−λx</sup>: Esponenziale(λ).'], ['Con N = 1000 osservazioni, quanto vale il raggio della banda DKW al 95%? Quante osservazioni servono per dimezzarlo?', 'ε = √(log 40/2000) ≈ 0,043. Il raggio scala come 1/√N: per dimezzarlo servono 4000 osservazioni.']],

    avanzato: '<h3>Regressione verso la media</h3><p>Con varianze uguali, E(Y | X = x) = ρx con |ρ| &lt; 1: valori estremi di X sono accompagnati, in media, da valori di Y meno estremi. È il fenomeno osservato da Galton sulle altezze di padri e figli, ed è una conseguenza della correlazione imperfetta, non di un meccanismo causale.</p><h3>Copule</h3><p>Per il teorema di Sklar ogni legge congiunta continua si scrive come C(F<sub>X</sub>(x), F<sub>Y</sub>(y)): le marginali e la struttura di dipendenza (la copula C) si separano. La normale bivariata ha copula gaussiana; esistono congiunte con marginali normali ma copula diversa, e quindi non normali.</p><h3>Misure di dipendenza oltre la correlazione</h3><p>Il ρ di Spearman (correlazione dei ranghi) e il τ di Kendall dipendono solo dalla copula e sono invarianti per trasformazioni monotone; la correlazione di distanza di Székely è nulla se e solo se c’è indipendenza.</p>',

    valutiamo: [['Convergenza delle traiettorie', 'quanto le quattro medie si avvicinano a μ e restano nella banda'], ['Forma della distribuzione delle medie', 'l’istogramma delle medie standardizzate contro la N(0, 1)'], ['Velocità', 'asimmetria osservata contro γ/√n e distanza da Φ contro il limite di Berry–Esseen'], ['Fallimento', 'il comportamento della Cauchy']],
    tabella: 'Media 0 e varianza 1 della media standardizzata sono esatte per ogni n; la coda P(|z| > 1,96) = 0,05 vale solo al limite. La distanza osservata include l’errore Monte Carlo (circa 1/√B), per questo con dati discreti può superare di poco il limite di Berry–Esseen.',
    esempio: '<p><strong>Esempio svolto.</strong> Dati Esponenziale(1): γ = 2. Con n = 10 l’asimmetria della media è 2/√10 ≈ 0,63, ancora ben visibile; con n = 100 scende a 0,2. Per avere asimmetria 0,1 servono n = 400 osservazioni.</p>',
    errori: ['Credere che dopo una serie di valori alti “debbano” arrivare valori bassi (fallacia del giocatore)', 'Applicare il TCL ai singoli dati invece che alla media', 'Confondere n (numerosità del campione) con B (numero di campioni simulati)', 'Usare la normale per la media di dati con varianza infinita'],
    avanzato: '<h3>Legge forte e legge del logaritmo iterato</h3><p>Le traiettorie convergono quasi certamente (Kolmogorov), e la legge del logaritmo iterato descrive l’ampiezza esatta delle oscillazioni: lim sup (x̄ₙ − μ)/(σ√(2 log log n / n)) = 1. Le traiettorie escono dalla banda ±1,96σ/√n infinite volte, ma sempre più raramente in proporzione.</p><h3>Teorema di Lindeberg–Feller</h3><p>Per somme di variabili indipendenti non identicamente distribuite la normalità limite vale se nessun termine domina (condizione di Lindeberg). È il fondamento della normalità asintotica degli stimatori in regressione.</p><h3>Metodo delta</h3><p>Se √n(x̄ₙ − μ) → N(0, σ²) e g è derivabile con g′(μ) ≠ 0, allora √n(g(x̄ₙ) − g(μ)) → N(0, g′(μ)²σ²). Così si ottengono, per esempio, gli errori standard di log x̄ o di 1/x̄.</p>',
    esercizi: [['Con dati Bernoulli(0,35) e n = 30, la probabilità che x̄ superi 0,5 è piccola? Usa il TCL.', 'σ/√n = √(0,2275/30) ≈ 0,087; z = (0,5 − 0,35)/0,087 ≈ 1,72 ⇒ circa 0,043 (con correzione di continuità ≈ 0,06).'], ['Perché per la Cauchy la media di n osservazioni ha la stessa legge di una sola?', 'Funzione caratteristica e<sup>−|t|</sup>: φ(t/n)ⁿ = e<sup>−|t|</sup>. La Cauchy è stabile con indice 1.'], ['Calcola il limite di Berry–Esseen per l’Uniforme con n = 10.', '0,4748 · 1,299/√10 ≈ 0,195: una garanzia molto prudente rispetto alla distanza effettiva, molto più piccola.']],
    riferimenti: ['Billingsley P. (1995). Probability and Measure, 3ª ed. Wiley, §§ 6, 27.', 'Shevtsova I. (2011). On the absolute constants in the Berry–Esseen type inequalities. arXiv:1111.6554.', 'Wasserman L. (2004). All of Statistics. Springer, cap. 5.']
  },
  adattamento: {
    obiettivi: ['Valutare graficamente l’adattamento con istogramma e QQ plot', 'Costruire correttamente il test X²: classi, attese minime, gradi di libertà', 'Capire l’effetto della stima dei parametri sulla distribuzione del test', 'Usare il bootstrap parametrico per un p-value affidabile'],
    valutiamo: [['Accordo globale', 'il p-value del test X² (asintotico e Monte Carlo)'], ['Dove il modello sbaglia', 'gli scostamenti del QQ plot dalla retta, soprattutto nelle code'], ['Potenza del test', 'come cambia la decisione aumentando N con un modello sbagliato'], ['Errore di primo tipo', 'quanto spesso si rifiuta quando il modello è quello vero']],
    tabella: 'X² misura la distanza tra frequenze osservate e attese; i gradi di libertà sono classi − 1 − parametri stimati. Il p-value asintotico usa la χ²; quello Monte Carlo ricostruisce la distribuzione di X² sotto il modello stimato ed è più affidabile. La distanza di Kolmogorov è indicativa: con parametri stimati non si usano le tabelle classiche.',
    esempio: '<p><strong>Esempio svolto.</strong> 200 dati da una Gamma(2, 1) confrontati con una Normale stimata: X² ≈ 62 con 17 gradi di libertà. Poiché E χ²₁₇ = 17 e Var = 34, un valore di 62 è a più di 7 deviazioni standard: p ≈ 5·10⁻⁷. Il QQ plot mostra il motivo: la coda destra dei dati è più lunga di quella normale.</p>',
    errori: ['Interpretare un p-value grande come prova che il modello è giusto', 'Usare classi con frequenze attese molto piccole', 'Dimenticare di togliere i gradi di libertà per i parametri stimati', 'Usare il test di Kolmogorov–Smirnov con parametri stimati e tabelle classiche'],
    avanzato: '<h3>Test basati sulla funzione di ripartizione empirica</h3><p>Oltre a Kolmogorov (sup|F̂ − F|), Cramér–von Mises (∫(F̂ − F)² dF) e Anderson–Darling (che pesa di più le code con 1/[F(1 − F)]) sono in genere più potenti. Con parametri stimati la loro distribuzione dipende dalla famiglia: tavole specifiche o bootstrap parametrico.</p><h3>Test di normalità</h3><p>Shapiro–Wilk confronta i quantili ordinati con i quantili normali attesi tramite una combinazione lineare ottimale; è tra i test più potenti contro molte alternative. In R: <code>shapiro.test()</code>.</p><h3>Selezione del numero di classi</h3><p>Per il X² con classi equiprobabili, Mann e Wald suggerirono k ≈ 4(2n²/z²)<sup>1/5</sup>; nella pratica si bilanciano potenza e validità dell’approssimazione (attese ≥ 5).</p>',
    esercizi: [['Con k = 10 classi e 2 parametri stimati, quanti gradi di libertà ha il X²? E se i parametri fossero noti?', '10 − 1 − 2 = 7; con parametri noti 9.'], ['Una curva a forma di S nel QQ plot normale che cosa indica?', 'Code diverse dalla normale: S con estremi che si allontanano verso l’esterno indica code più pesanti.'], ['Perché con N = 2000 si rifiuta quasi sempre anche un modello “quasi giusto”?', 'La potenza cresce con N: anche piccole discrepanze diventano statisticamente significative, senza essere necessariamente rilevanti.']],
    riferimenti: ['D’Agostino R. B., Stephens M. A. (1986). Goodness-of-Fit Techniques. Marcel Dekker.', 'Chernoff H., Lehmann E. L. (1954). The use of maximum likelihood estimates in χ² tests for goodness of fit. Annals of Mathematical Statistics 25, 579–586.', 'Lilliefors H. W. (1967). On the Kolmogorov–Smirnov test for normality with mean and variance unknown. JASA 62, 399–402.']
  },
  stimatori: {
    obiettivi: ['Confrontare stimatori diversi sugli stessi campioni', 'Usare distorsione, varianza, errore quadratico medio e robustezza come criteri', 'Collegare l’efficienza alla forma delle code della popolazione', 'Distinguere esattezza, asintotica e Monte Carlo nei risultati'],
    valutiamo: [['Centro', 'se le stime si distribuiscono attorno a θ'], ['Precisione', 'la larghezza delle distribuzioni campionarie (dev. std e scarto interquartile)'], ['Efficienza relativa', 'il rapporto delle varianze contro il valore asintotico'], ['Robustezza', 'il comportamento con code pesanti (Laplace, Cauchy)']],
    tabella: 'Ogni riga è uno stimatore. “Centro” è la mediana delle stime (esiste sempre); dev. std ed errore quadratico medio sono confrontati con la teoria, quando esiste. Per la media di dati Cauchy la teoria non ha varianza: il † segnala che il numero simulato non converge.',
    esempio: '<p><strong>Esempio svolto.</strong> Dati normali, n = 20: Var(x̄) = 1/20 = 0,05, Var(mediana) ≈ π/40 ≈ 0,0785. L’efficienza della mediana è 0,64: con la mediana servono circa 31 osservazioni per ottenere la precisione della media con 20.</p>',
    errori: ['Scegliere uno stimatore guardando una sola simulazione', 'Credere che lo stimatore “migliore” lo sia per ogni legge dei dati', 'Usare la varianza per confrontare stimatori con code pesanti, invece di scarti interquartili', 'Chiamare la mediana MLE della Cauchy'],
    avanzato: '<h3>Media troncata e M-stimatori</h3><p>La media troncata al 10% scarta il 10% delle osservazioni per lato: ha efficienza 0,94 sotto normalità e resta robusta. Gli M-stimatori di Huber minimizzano Σρ(xᵢ − θ) con ρ quadratica al centro e lineare nelle code: un compromesso continuo tra media e mediana.</p><h3>Funzione di influenza</h3><p>IF(x) misura l’effetto di una contaminazione infinitesima in x: per la media è x − θ (illimitata), per la mediana sign(x − θ)/(2f(θ)) (limitata). La varianza asintotica è E IF², da cui si ricavano tutte le efficienze del laboratorio.</p><h3>Efficienza relativa asintotica</h3><p>Per la mediana contro la media in una famiglia di posizione, ARE = 4f(θ)²σ². Per ogni legge simmetrica unimodale ARE ≥ 1/3 (e il minimo si raggiunge con l’uniforme); per code pesanti può essere arbitrariamente grande.</p>',
    esercizi: [['Calcola l’efficienza della mediana rispetto alla media per la Laplace con b = 1.', 'Var(x̄) = 2/n, Var(mediana) ≈ 1/(4n f(0)²) = 1/n ⇒ ARE = 2.'], ['Perché la media di dati Cauchy non migliora aumentando n?', 'x̄ ~ Cauchy(θ, 1) per ogni n: la sua dispersione non dipende da n.'], ['Proponi uno stimatore robusto ed efficiente per dati quasi normali con pochi valori anomali.', 'Media troncata al 10–20% o M-stimatore di Huber: perdono pochissimo sotto normalità e limitano l’influenza dei valori anomali.']],
    riferimenti: ['Huber P. J., Ronchetti E. M. (2009). Robust Statistics, 2ª ed. Wiley.', 'Lehmann E. L., Casella G. (1998). Theory of Point Estimation, 2ª ed. Springer.', 'Hampel F. R. et al. (1986). Robust Statistics: The Approach Based on Influence Functions. Wiley.']
  },
  fisher: {
    obiettivi: ['Leggere la log-verosimiglianza di un campione come funzione del parametro', 'Interpretare score e informazione osservata e attesa', 'Verificare le identità di Bartlett e il limite di Cramér–Rao', 'Confrontare intervalli di Wald e del rapporto di verosimiglianza; riconoscere i modelli non regolari'],
    valutiamo: [['Curvatura', 'quanto è appuntita la log-verosimiglianza: più curvatura, più informazione'], ['Bontà dell’approssimazione quadratica', 'la curva tratteggiata contro quella vera'], ['Identità di Bartlett', 'media dello score ≈ 0, varianza dello score ≈ media dell’informazione osservata ≈ n I(θ)'], ['Efficienza', 'la varianza di θ̂ contro il limite 1/(n I(θ))']],
    tabella: 'Le prime tre righe verificano le identità esatte che legano score e informazione. Le successive confrontano media e varianza di θ̂ con i valori esatti (quando noti) e con il limite di Cramér–Rao; le ultime due misurano la copertura reale di due intervalli al 95% costruiti dalla verosimiglianza.',
    esempio: '<p><strong>Esempio svolto.</strong> Esponenziale(λ = 1), n = 20: ℓ(λ) = 20 log λ − λΣxᵢ, λ̂ = 1/x̄, J(λ) = 20/λ², I(λ) = 1/λ². Cramér–Rao: 1/20 = 0,05. Ma λ̂ è distorto (E λ̂ = 20/19) e la sua varianza esatta è 400/(19²·18) ≈ 0,0616: il limite vale per stimatori non distorti, e λ̂ lo raggiunge solo asintoticamente.</p>',
    errori: ['Interpretare la verosimiglianza come la probabilità del parametro', 'Applicare Cramér–Rao a stimatori distorti o a modelli non regolari', 'Usare l’intervallo di Wald quando la verosimiglianza è molto asimmetrica', 'Dimenticare che I(θ) è per osservazione: l’informazione del campione è n I(θ)'],
    avanzato: '<h3>Riparametrizzazione</h3><p>Se ψ = g(θ), allora I<sub>ψ</sub>(ψ) = I<sub>θ</sub>(θ)/g′(θ)². L’intervallo di Wald dipende dalla parametrizzazione, quello del rapporto di verosimiglianza no. Esiste una parametrizzazione che rende l’informazione costante (stabilizzazione della varianza, es. √λ per la Poisson).</p><h3>Parametri di disturbo</h3><p>Con più parametri l’informazione diventa una matrice; la varianza asintotica di θ̂₁ è [I⁻¹]₁₁ ≥ 1/I₁₁: non conoscere gli altri parametri costa informazione. La verosimiglianza profilo ℓ<sub>p</sub>(θ₁) = max<sub>θ₂</sub> ℓ(θ₁, θ₂) estende il rapporto di verosimiglianza.</p><h3>Test score, Wald e rapporto di verosimiglianza</h3><p>Sono asintoticamente equivalenti sotto H₀ (tutti χ²), ma diversi per n finito: lo score usa la curvatura in θ₀, Wald in θ̂, il rapporto di verosimiglianza l’intera curva tra i due.</p>',
    esercizi: [['Calcola l’informazione di Fisher per la Bernoulli(p) e il limite di Cramér–Rao per n = 50, p = 0,3.', 'I(p) = 1/[p(1 − p)] ⇒ CR = p(1 − p)/n = 0,21/50 = 0,0042.'], ['Perché il modello Uniforme (0, θ) non è regolare?', 'Il supporto dipende da θ: non si può derivare sotto il segno di integrale e la log-verosimiglianza ha il massimo su un bordo.'], ['Con ℓ(θ̂) − ℓ(θ₀) = 2,5, il test del rapporto di verosimiglianza rifiuta H₀: θ = θ₀ al 5%?', '2 · 2,5 = 5 &gt; 3,84 = χ²₁,₀.₉₅: sì.']],
    riferimenti: ['Azzalini A. (1996). Statistical Inference Based on the Likelihood. Chapman & Hall.', 'Pawitan Y. (2001). In All Likelihood. Oxford University Press.', 'Casella G., Berger R. L. (2002). Statistical Inference, 2ª ed., capp. 7 e 10.']
  },
  intervalli: {
    obiettivi: ['Interpretare correttamente il livello di confidenza', 'Distinguere metodi pivotali, asintotici ed esatti per dati discreti', 'Calcolare la copertura reale di un metodo', 'Valutare il compromesso tra copertura e ampiezza'],
    valutiamo: [['Copertura', 'la frazione di intervalli che contengono il vero valore, contro il livello nominale'], ['Copertura esatta', 'la vera probabilità di copertura del metodo, calcolata (linea verde)'], ['Ampiezza', 'quanto sono larghi gli intervalli in media'], ['Casi critici', 'p vicino a 0 o 1, n piccolo, intervalli degeneri']],
    tabella: 'Nominale è il livello dichiarato; Esatta è la vera probabilità di copertura del metodo con questi parametri (per Bernoulli e Poisson calcolata sommando su tutti i valori possibili della statistica sufficiente); Simulazione è la frequenza osservata, con il suo margine Monte Carlo.',
    esempio: '<p><strong>Esempio svolto.</strong> Wald per una proporzione con p = 0,1 e n = 20: P(p̂ = 0) = 0,9²⁰ ≈ 0,12, e in quel caso l’intervallo è il solo punto 0, che non copre mai. Già questo sottrae il 12% di copertura: la copertura esatta è 87,6%, non 95%.</p>',
    errori: ['Dire “θ sta nell’intervallo con probabilità 95%” dopo averlo calcolato', 'Usare Wald per proporzioni con np(1 − p) piccolo', 'Pensare che un intervallo esatto abbia copertura esattamente nominale con dati discreti', 'Confrontare metodi solo per la copertura, ignorando l’ampiezza'],
    avanzato: '<h3>Clopper–Pearson</h3><p>Per la binomiale, l’analogo di Garwood inverte due test unilaterali esatti: [B(α/2; s, n − s + 1), B(1 − α/2; s + 1, n − s)] con B quantili Beta. Copertura ≥ nominale per ogni p, spesso molto conservativa: Agresti e Coull raccomandano Wilson o il loro intervallo “aggiustato” (aggiungere 2 successi e 2 insuccessi).</p><h3>Intervalli bootstrap</h3><p>Quando non c’è un pivot noto si ricampiona: percentile, BCa, bootstrap-t. Hanno copertura asintoticamente corretta, con errori di ordine 1/√n (percentile) o 1/n (BCa, bootstrap-t).</p><h3>Interpretazione bayesiana</h3><p>Un intervallo di credibilità soddisfa P(θ ∈ C | dati) = 0,95: è l’affermazione che spesso si vorrebbe fare, ma richiede una distribuzione a priori. Per molte situazioni regolari i due approcci danno intervalli numericamente simili.</p>',
    esercizi: [['Calcola l’intervallo Z al 95% con x̄ = 10,4, σ = 2, n = 25.', '10,4 ± 1,96 · 2/5 = [9,616; 11,184].'], ['Con S = 0 eventi in n = 10 osservazioni Poisson, quanto vale l’estremo superiore di Garwood al 95%?', 'χ²₂;₀.₉₇₅/(2·10) = 7,378/20 ≈ 0,369.'], ['Perché l’intervallo t è in media più largo dello Z?', 't<sub>n−1</sub> &gt; z e la stima s introduce variabilità aggiuntiva; per n → ∞ la differenza svanisce.']],
    riferimenti: ['Brown L. D., Cai T. T., DasGupta A. (2001). Interval estimation for a binomial proportion. Statistical Science 16, 101–133.', 'Agresti A., Coull B. A. (1998). Approximate is better than “exact”. The American Statistician 52, 119–126.', 'Garwood F. (1936). Fiducial limits for the Poisson distribution. Biometrika 28, 437–442.']
  },
  test: {
    obiettivi: ['Distinguere errore di primo e di secondo tipo', 'Calcolare e interpretare la potenza', 'Dimensionare un campione per una potenza desiderata', 'Interpretare correttamente il p-value'],
    valutiamo: [['Errore di primo tipo', 'frequenza dei rifiuti quando H₀ è vera, contro α'], ['Potenza', 'frequenza dei rifiuti quando H₁ è vera, contro il valore teorico'], ['Ruolo di n e δ', 'come la curva di potenza si sposta con n e con l’effetto'], ['Bilaterale contro unilaterale', 'come cambia la potenza dividendo α tra due code']],
    tabella: 'La prima riga verifica che il test rispetti il livello scelto; la seconda che la potenza simulata coincida con la formula; la terza è il complemento della potenza (l’effetto c’è ma non viene visto). L’errore Monte Carlo è indicato accanto ai valori simulati.',
    esempio: '<p><strong>Esempio svolto.</strong> δ = 0,5, α = 0,05 bilaterale, n = 20: spostamento atteso δ√n = 2,236; potenza ≈ Φ(2,236 − 1,96) = Φ(0,276) ≈ 0,609. Per potenza 80% servono n ≈ ((1,96 + 0,842)/0,5)² ≈ 32 osservazioni.</p>',
    errori: ['Interpretare il p-value come probabilità che H₀ sia vera', 'Concludere “nessun effetto” da un test non significativo con bassa potenza', 'Scegliere il test unilaterale dopo aver visto i dati', 'Confondere significatività statistica e rilevanza pratica'],
    avanzato: '<h3>Test multipli</h3><p>Con m test indipendenti al 5%, la probabilità di almeno un falso positivo è 1 − 0,95<sup>m</sup> (64% con m = 20). Bonferroni controlla questo rischio usando α/m; Benjamini–Hochberg controlla il tasso atteso di false scoperte ed è molto più potente.</p><h3>Potenza post hoc</h3><p>Calcolare la potenza usando l’effetto stimato dai dati stessi non aggiunge informazione: è una funzione monotona del p-value. La potenza va calcolata prima, per un effetto ritenuto rilevante.</p><h3>Errore di tipo S e M</h3><p>Con bassa potenza, i risultati significativi sovrastimano sistematicamente l’effetto (errore di tipo M, magnitudo) e possono perfino avere il segno sbagliato (tipo S): un motivo in più per dimensionare bene gli studi (Gelman e Carlin, 2014).</p>',
    esercizi: [['Qual è la potenza del test Z unilaterale con δ = 0,3, n = 50, α = 0,05?', 'Φ(0,3√50 − 1,645) = Φ(2,121 − 1,645) = Φ(0,476) ≈ 0,68.'], ['Quante osservazioni servono per potenza 90% con δ = 0,4, α = 0,05 bilaterale?', '((1,96 + 1,282)/0,4)² ≈ 65,7 ⇒ 66.'], ['Perché sotto H₀ il p-value è uniforme?', 'Se T ha ripartizione continua F sotto H₀, p = 1 − F(T) e F(T) ~ U(0, 1).']],
    riferimenti: ['Lehmann E. L., Romano J. P. (2005). Testing Statistical Hypotheses, 3ª ed. Springer.', 'Wasserstein R. L., Lazar N. A. (2016). The ASA statement on p-values. The American Statistician 70, 129–133.', 'Gelman A., Carlin J. (2014). Beyond power calculations. Perspectives on Psychological Science 9, 641–651.']
  },
  regressione: {
    obiettivi: ['Stimare e interpretare una retta di regressione', 'Distinguere intervallo per la media e intervallo di previsione', 'Riconoscere punti ad alta leva e osservazioni influenti', 'Verificare quando le coperture nominali sono affidabili'],
    valutiamo: [['Sensibilità della retta', 'come si sposta trascinando un punto, al centro o ai bordi'], ['Bande', 'la banda per E(Y | x) contro l’intervallo di previsione per una nuova Y'], ['Influenza', 'leva, residui standardizzati e distanza di Cook'], ['Validità degli intervalli', 'le coperture simulate con errori normali, a code pesanti e asimmetrici']],
    tabella: 'Le prime due righe verificano che la pendenza stimata sia non distorta con deviazione standard σ/√Sxx (vero per qualunque legge degli errori con varianza σ²). Le ultime due misurano la copertura dei due intervalli in x₀: esatte con errori normali, solo approssimate altrimenti.',
    esempio: '<p><strong>Esempio svolto.</strong> Con n = 12 punti equispaziati in [0, 10], Sxx ≈ 99,3: se σ = 1,5 la deviazione standard di β̂₁ è 1,5/√99,3 ≈ 0,151. Raddoppiare l’ampiezza dell’intervallo delle x quadruplica Sxx e dimezza l’incertezza sulla pendenza.</p>',
    errori: ['Usare l’intervallo per la media quando si vuole prevedere un singolo valore', 'Eliminare i punti influenti senza indagarne il motivo', 'Estrapolare la retta lontano dall’intervallo delle x osservate', 'Leggere R² alto come prova che il modello lineare sia corretto'],
    avanzato: '<h3>Diagnostica dei residui</h3><p>Grafico residui contro valori stimati (forme a imbuto indicano eteroschedasticità, curve indicano non linearità), QQ plot dei residui (normalità), residui contro tempo (correlazione). In R: <code>plot(lm)</code> produce i quattro grafici classici.</p><h3>Errori standard robusti</h3><p>Con eteroschedasticità gli stimatori OLS restano non distorti ma gli errori standard classici sono sbagliati; gli errori “sandwich” di White, (XᵀX)⁻¹XᵀΩ̂X(XᵀX)⁻¹, sono consistenti (pacchetto <code>sandwich</code>).</p><h3>Leva e progetto sperimentale</h3><p>Var(β̂₁) = σ²/Sxx: per stimare una pendenza conviene concentrare le x agli estremi, ma così non si può più verificare la linearità. Il disegno ottimo dipende dallo scopo.</p>',
    esercizi: [['Mostra che la retta dei minimi quadrati passa per (x̄, ȳ).', 'β̂₀ = ȳ − β̂₁x̄ ⇒ ŷ(x̄) = ȳ.'], ['Perché i residui di punti ad alta leva tendono a essere piccoli?', 'Var(eᵢ) = σ²(1 − hᵢ): con hᵢ vicino a 1 la retta passa quasi per il punto.'], ['Con s = 1,2, n = 20, x₀ = x̄, quanto è largo l’intervallo di previsione al 95%?', '2 · t₁₈ · 1,2 · √(1 + 1/20) ≈ 2 · 2,101 · 1,23 ≈ 5,17.']],
    riferimenti: ['Weisberg S. (2014). Applied Linear Regression, 4ª ed. Wiley.', 'Cook R. D. (1977). Detection of influential observation in linear regression. Technometrics 19, 15–18.', 'Fox J. (2016). Applied Regression Analysis and Generalized Linear Models, 3ª ed. Sage.']
  },
  'regressione-lp': {
    obiettivi: ['Confrontare criteri di stima diversi sugli stessi dati', 'Collegare ciascun criterio alla legge degli errori per cui è ottimo', 'Valutare robustezza ed efficienza con code pesanti e contaminazione', 'Comprendere l’algoritmo dei minimi quadrati ripesati'],
    valutiamo: [['Precisione', 'la larghezza delle distribuzioni delle pendenze per L2, L1 e Lp'], ['Robustezza', 'quanto le rette resistono a valori anomali nella y'], ['Efficienza relativa', 'il rapporto delle varianze asintotiche L2/L1'], ['Ruolo di p', 'come cambia la precisione spostando p tra 1 e 3']],

      var x1 = a[0] + ux * 58, y1 = a[1] + uy * 20, x2 = b[0] - ux * 58, y2 = b[1] - uy * 20;

  /* ---------- interpretazione ---------- */
  var interpBox, lawCard;
  function interpretation() {
    var L = law(), th = theory(), notes = [];
    if (isNaN(th.mean)) notes.push('<strong>Il valore atteso non esiste.</strong> La media campionaria si può sempre calcolare, ma non converge a nulla: osserva come salta quando compare un valore estremo. Per descrivere il centro usa la mediana, per la dispersione lo scarto interquartile.');
    else if (!isFinite(th.var) || isNaN(th.var)) notes.push('<strong>La varianza non è finita.</strong> La media converge (lentamente), ma la varianza empirica no, e il teorema centrale nella forma classica non si applica.');
    if (L.kind === 'discrete') notes.push('Per una legge discreta la probabilità sta nei punti: P(a < X ≤ b) = F(b) − F(a) dipende da quali estremi sono inclusi. Prova a spostare <span class="m">a</span> di una unità.');
    else notes.push('Per una legge continua f(x) non è una probabilità (può superare 1): la probabilità è l’<strong>area</strong> sotto la curva, uguale al salto F(b) − F(a) nel grafico sotto.');
    notes.push('Con N osservazioni la ripartizione empirica resta, con probabilità almeno 95%, entro la banda DKW di raggio √(log(40)/(2N)): un risultato <em>esatto</em>, valido per ogni N e ogni legge. La distanza osservata sup|F̂ − F| la verifica sui tuoi dati.');
    interpBox.innerHTML = notes.map(function (n) { return '<p>' + n + '</p>'; }).join('');
    lawCard.innerHTML = '';
    lawCard.append(el('div.step-label', L.kind === 'discrete' ? 'Legge discreta' : 'Legge continua'),
      el('h3', { style: 'margin:0 0 6px' }, L.label), el('p.muted', { style: 'margin:0 0 8px', html: L.story }),
      el('div.eq', { style: 'margin:8px 0 0;font-size:1rem', html: L.formula }));
  }

          '      xlab = "x", ylab = "' + lab3 + '", zlab = "' + (disc ? 'P(X = x)' : 'f(x)') + '", ticktype = "detailed",',

  /* ---------- teoria ---------- */
  var THEORY = {
    base: function () {
      var L = law();
      return el('div.prose', { html:
        '<h3>Tre modi di descrivere una legge</h3>' +
        '<p>Una variabile aleatoria <span class="m">X</span> è descritta completamente dalla <strong>funzione di ripartizione</strong> F(x) = P(X ≤ x), definita per ogni legge. Per una legge discreta si usano anche le probabilità P(X = x); per una legge continua la <strong>densità</strong> f(x), con F(x) = ∫ f(t) dt fino a x.</p>' +
        '<div class="eq">P(a &lt; X ≤ b) = F(b) − F(a)</div>' +
        '<p>Nel continuo è l’area sotto f tra a e b; nel discreto è la somma delle probabilità dei punti in (a, b].</p>' +
        '<h3>' + L.label + '</h3><div class="eq">' + L.formula + '</div><p>' + L.story + '</p>' +
        '<h3>Momenti: non sempre esistono</h3>' +
        '<p>Il valore atteso esiste se E|X| &lt; ∞. Per la Cauchy, e per la t con ν = 1, non esiste: la media campionaria non si stabilizza. Per la t con ν ≤ 2 o la F con ν₂ ≤ 4 la varianza non è finita. In questi casi la tabella lo dichiara e segna con † i valori empirici che non convergono.</p>' +
        '<h3>Come vengono generati i dati</h3>' +
        '<p>Ogni osservazione è X = F⁻¹(U), con U uniforme in (0, 1). È il <strong>metodo di inversione</strong>: funziona per qualunque legge e permette a R di riprodurre esattamente gli stessi valori con <code>' + L.rq + '(runif(N), …)</code>.</p>' +
        '<div class="callout warn">L’istogramma che somiglia alla densità non dimostra che i dati vengano da quella legge: ci sono infinite leggi compatibili con un campione finito. La banda DKW quantifica quanta discrepanza è normale aspettarsi.</div>' });
    },
    adv: function () {
      return el('div.prose', { html:
        '<h3>Proprietà della funzione di ripartizione</h3>' +
        '<p>F è non decrescente, continua a destra, con limiti 0 in −∞ e 1 in +∞; ogni funzione con queste proprietà è la ripartizione di qualche legge. I salti di F sono gli atomi: P(X = x) = F(x) − F(x⁻).</p>' +
        '<h3>Inversione generalizzata</h3>' +
        '<div class="eq">F⁻¹(u) = inf { x : F(x) ≥ u }, &nbsp; 0 &lt; u &lt; 1</div>' +
        '<p>Per la continuità a destra, F⁻¹(u) ≤ x ⟺ u ≤ F(x). Se U ~ U(0, 1) allora P(F⁻¹(U) ≤ x) = P(U ≤ F(x)) = F(x): la variabile F⁻¹(U) ha esattamente ripartizione F, anche per leggi discrete. È la definizione usata da <code>qbinom</code>, <code>qpois</code> e simili in R.</p>' +
        '<h3>Glivenko–Cantelli e DKW</h3>' +
        '<p>La ripartizione empirica F̂<sub>N</sub>(x) = #{Xᵢ ≤ x}/N converge uniformemente a F quasi certamente (Glivenko–Cantelli). La disuguaglianza di Dvoretzky–Kiefer–Wolfowitz, con la costante ottimale di Massart (1990), dà una velocità esplicita:</p>' +
        '<div class="eq">P( sup<sub>x</sub> |F̂<sub>N</sub>(x) − F(x)| &gt; ε ) ≤ 2 e<sup>−2Nε²</sup></div>' +
        '<p>Ponendo il secondo membro uguale a 0,05 si ottiene ε = √(log(40)/(2N)): la banda nel grafico. Vale per ogni N e ogni F (per le leggi discrete è conservativa). La statistica sup|F̂ − F| è quella del test di Kolmogorov–Smirnov.</p>' +
        '<h3>Esistenza dei momenti</h3>' +
        '<p>E|X|<sup>r</sup> &lt; ∞ dipende dalle code: se f(x) ~ c|x|<sup>−(α+1)</sup>, esistono i momenti di ordine r &lt; α. Per la t(ν) α = ν; per la Cauchy α = 1; per la F(ν₁, ν₂) α = ν₂/2.</p>' });
    }
  };

    });

  }
  function buildAB() {
    var L = law(), disc = L.kind === 'discrete', st = disc ? 1 : step(S);
    var lo = disc ? S.lo - 1 : S.lo, hi = S.hi;

    abBox.append(
      SA.ui.slider('Estremo a', { min: lo, max: hi, step: st, value: S.a, format: fmtv, oninput: function (v) { S.a = Math.min(v, S.b - st); drawDensity(); drawCdf(); },
        onchange: function () { S.a = +S.a.toPrecision(6); refreshAll(true); } }),
      SA.ui.slider('Estremo b', { min: lo, max: hi, step: st, value: S.b, format: fmtv, oninput: function (v) { S.b = Math.max(v, S.a + st); drawDensity(); drawCdf(); },
        onchange: function () { S.b = +S.b.toPrecision(6); refreshAll(true); } }));
  }
  function restart(resetInterval) {
    run.stop();

  }

  function interpretation() {
    interpBox.innerHTML = S.mode === 'inv'
      ? '<p>L’inversione è il ponte tra il generatore di numeri casuali, che produce solo uniformi, e qualunque legge: basta conoscere F⁻¹. Per le leggi <strong>discrete</strong> F ha salti e l’inversa va presa in senso generalizzato, F⁻¹(u) = min{x : F(x) ≥ u}: un intero intervallo di u viene mandato nello stesso valore x, di lunghezza pari a P(X = x).</p><p>È il metodo usato da StatAtlas in tutti i laboratori, ed è il motivo per cui <code>' + law().rq + '(runif(n), …)</code> in R produce gli stessi numeri. Non è sempre il più veloce: per la Normale, ad esempio, F⁻¹ non ha forma chiusa e va calcolata numericamente.</p>'
      : '<p>Entrambi gli stimatori sono <strong>non distorti</strong> e convergono a I, ma con varianze diverse. Per 0 ≤ f ≤ 1 la media di f(U) non è mai peggiore: Var f(U) = ∫f² − I² ≤ ∫f − I² = I(1 − I). Questo non significa che in <em>ogni</em> simulazione la media sia più vicina a I: lo è in media quadratica.</p><p>L’errore Monte Carlo decresce come 1/√n: per dimezzarlo servono quattro volte più punti. Le bande tratteggiate nel grafico sono I ± 1,96 σ/√n per ciascun metodo.</p>';

(function () {

      gen: function (g) { return Math.exp(g.norm()); }, r: 'rlnorm(%n)', dens: function (x) { return x <= 0 ? 0 : SA.dens.norm(Math.log(x), 0, 1) / x; }, range: [0, 8] },

      r: 'list(mean = mean(x), sd = sqrt(mean((x - mean(x))^2)))', rq: 'qnorm' },
    exp:   { label: 'Esponenziale (λ stimato)', law: 'exp', k: 1, pos: true, fit: function (x) { return { rate: 1 / SA.stat.mean(x) }; }, r: 'list(rate = 1 / mean(x))', rq: 'qexp' },
    lnorm: { label: 'Lognormale (μ, σ di log X stimati)', law: 'lnorm', k: 2, pos: true, fit: function (x) { var l = Array.prototype.map.call(x, Math.log), m = SA.stat.mean(l), v = 0; l.forEach(function (u) { v += (u - m) * (u - m); }); return { meanlog: m, sdlog: Math.sqrt(v / l.length) }; },

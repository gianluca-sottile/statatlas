name: StatAtlas QA

# Un solo job leggero per push/PR. Nessun R, Chromium o pacchetto scientifico
# viene installato automaticamente: la validazione sostanziale e' locale.
# La verifica completa rimane disponibile manualmente su GitHub Actions.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.png'
      - '**/*.csv'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.png'
      - '**/*.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statatlas-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build e smoke JS: questo e' l'unico job eseguito a ogni push.
  quick:
    name: Build + JavaScript smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone HTML
        run: python build.py
      - name: JavaScript regression and curriculum checks
        run: |
          set -eu
          for file in tests/test_*.js; do node "$file"; done

  # Eseguibile solo con il pulsante "Run workflow". Non rallenta push/Pages.
  full-science-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Independent science (manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific verification dependencies
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.11'
      - name: Independent verification of 31 laboratories
        run: |
          python tests/test_science_independent_31.py
          python tests/test_scientific_claims.py

  full-browser-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Browser + R exports (manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright>=1.55,<2' 'numpy>=1.24' 'scipy>=1.11'
          python -m playwright install --with-deps chromium
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Build
        run: python build.py
      - name: Export/parse all R scripts and numerical equivalence of spatial labs
        run: |
          python tests/test_r_exports_browser.py --require-r
          python tests/test_spatial_export_equivalence.py --require-r
      - name: Bilingual & accessibility smoke (manual only)
        run: |
          python tests/test_macrofase_C_i18n.py
          python tests/test_accessibility_C.py
      - name: Browser and teaching QA
        run: |
          python tests/test_course_bridge_browser.py --width 390
          python tests/test_course_bridge_browser.py --width 1366
          python tests/test_speed_slider_browser.py
          python tests/test_sample_sizes_browser.py
          python tests/test_large_sample_coverage.py
          python tests/test_mobile_tablet.py
          python tests/test_spatial_studio_browser.py
          python tests/test_spatial_studio_interactions.py
          python tests/test_spatial_unified_challenges.py
          python tests/test_challenges_browser_full.py
          python tests/test_pedagogy_browser.py --start 1 --stop 16
          python tests/test_pedagogy_browser.py --start 17 --stop 31
      - name: Phase D language-aware R links and reproducible experiments
        run: |
          python tests/test_D_course_urls_browser.py
          python tests/test_D_experiments.py 390
          python tests/test_D_experiments.py 1366
          python tests/test_D_changed_roundtrip.py 1366
          python tests/test_D_complex_roundtrip.py
          python tests/test_D_manual_points.py
          python tests/test_D_offline_links.py
      - name: Phase E offline Teachers path authoring (browser/manual only)
        run: |
          python tests/test_E_teachers.py 390
          python tests/test_E_teachers.py 1366
          python tests/test_E_presets_navigation.py 390
          python tests/test_E_presets_navigation.py 1366
          python tests/test_E_repeat_lab.py

      - name: Scientific workbench UX (browser/manual only)
        run: |
          python tests/test_UX_workbench.py --width 390
          python tests/test_UX_workbench.py --width 1366
          node tests/test_UX_contract.js

name: StatAtlas Scientific QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-and-scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific test dependencies
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.11'
      - name: Build offline HTML
        run: python build.py
      - name: JavaScript numerical and pedagogical suites
        run: |
          set -eu
          for file in tests/test_*.js; do
            node "$file"
          done
      - name: Independent scientific checks (31 labs)
        run: python tests/test_science_independent_31.py
      - name: Additional independent methodological checks
        run: python tests/test_scientific_claims.py

  spatial-ui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser dependencies
        run: |
          python -m pip install 'playwright>=1.55,<2' 'numpy>=1.24' 'scipy>=1.11'
          python -m playwright install --with-deps chromium
      - name: Install GNU R for syntax validation of 31 exported scripts
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Build StatAtlas
        run: python build.py
      - name: Validate all R exports (console lengths and GNU R parse)
        run: python tests/test_r_exports_browser.py --require-r
      - name: Numerical parity of six actual spatial R exports against independent Python and JS references
        run: python tests/test_spatial_export_equivalence.py --require-r
      - name: Responsive QA for all 31 labs (320, 390, 768 and 1024 px)
        run: python tests/test_mobile_tablet.py
      - name: Responsive spatial studio and map interactions
        run: |
          python tests/test_spatial_studio_browser.py
          python tests/test_spatial_studio_interactions.py
          python tests/test_spatial_unified_challenges.py
      - name: Browser QA for 93 challenges and teaching panels
        run: |
          python tests/test_challenges_browser_full.py
          python tests/test_pedagogy_browser.py --start 1 --stop 16
          python tests/test_pedagogy_browser.py --start 17 --stop 31
